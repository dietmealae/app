<header><div class="hw"><span class="lg">🥗</span><div><h1>Healthy Meal Manager</h1><div class="sub">Costing, menu and plans for Weight Loss, Weight Balance and Weight Gain meals</div></div></div></header><div id="bar"><nav id="nav"></nav><div id="ctl"><span id="sv"></span><button class="b" id="lob" onclick="logout()">Log out</button></div></div><main id="app"></main>
<script>
const K='hm-phase1';const DEF=()=>({items:[],recipes:[],pack:[],menu:{},exp:{Delivery:0,Gas:0,Electricity:0,Mobile:0,Ads:0,Cook:0,Helper:0},perDay:50,prices:{},q:{L:[0,0,0],D:[0,0,0]}});let S=DEF();
function migrate(){if(!S.target)S.target={WL:450,WB:600,WG:750};if(!Array.isArray(S.exp))S.exp=Object.entries(S.exp||{}).map(([name,amt])=>({name,amt}))}migrate();
let tab='items',day=1,mt='L',rsel=-1;
const CATS=[['WL','Weight Loss'],['WB','Weight Balance'],['WG','Weight Gain']],MK=['cal','p','c','f','fi'],ML=['kcal','Protein','Carbs','Fat','Fiber'];
const TABS=[['items','Raw items'],['recipes','Recipes'],['pack','Packaging'],['menu','Menu (24 days)'],['costs','Expenses and profit'],['calc','Order calculator'],['rank','Break-even and ranking'],['customers','Customers'],['orders','Orders'],['today','Today'],['backup','Backup']];
const n=v=>parseFloat(v)||0,f=(v,d=0)=>(+v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s??'').replace(/"/g,'&quot;');
function save(){queueSave();render()}
const FIN=['exp','perDay','prices','qf'];
const recV=()=>DR.idx2>=0?DR.idx2:S.recipes.length;
function isD(p){const a=p.split('.'),r0=a[0];return r0==='dr'||(r0==='recipes'&&!!DR.d2&&a.length>2&&+a[1]===recV())||(r0==='pack'&&tab==='pack'&&!!DR.pc)||(tab==='costs'&&!!DR.fc&&FIN.includes(r0))}
function ref(p){let a=p.split('.');const r0=a[0];let o=S;
if(r0==='dr')o=DR;
else if(r0==='recipes'&&DR.d2&&a.length>2&&+a[1]===recV()){a=['d2',...a.slice(2)];o=DR}
else if(r0==='pack'&&tab==='pack'&&DR.pc)o=DR.pc;
else if(tab==='costs'&&DR.fc&&FIN.includes(r0))o=DR.fc;
for(let i=0;i<a.length-1;i++)o=o[a[i]];return[o,a[a.length-1]]}
function set(p,v,num){const[o,k]=ref(p);o[k]=num?n(v):v;if(isD(p)){itMsg='';render()}else save()}
function add(p,obj){const[o,k]=ref(p);o[k].push(obj);if(isD(p))render();else save()}
function fixRefs(p,i){const m=v=>typeof v!=='number'?v:v===i?'':v>i?v-1:v;if(p==='items')S.recipes.forEach(r=>r.ing.forEach(g=>g.i=m(g.i)));if(p==='recipes')Object.values(S.menu).forEach(x=>x.lines.forEach(l=>l.r=m(l.r)));if(p==='pack')Object.values(S.menu).forEach(x=>x.pk.forEach(q=>q.p=m(q.p)))}
function del(p,i){const[o,k]=ref(p),it=(o[k]||[])[i],nm=it&&it.name?' "'+it.name+'"':'',w={items:'raw item',recipes:'recipe',pack:'packaging material',lines:'dish from this meal',pk:'packaging line',ing:'ingredient',st:'stage',exp:'expense'}[k]||'entry';const dn=delNote;delNote='';if(!confirm('Delete this '+w+nm+'? '+(dn?dn+' ':'')+'This cannot be undone.'))return false;if(!isD(p))fixRefs(p,i);o[k].splice(i,1);if(isD(p))render();else save();return true}
const I=(p,v,num,c='')=>`<input class="${c}" ${num?'type="number" step="any"':''} value="${esc(v)}" onchange="set('${p}',this.value,${num?1:0})">`;
const SL=(p,opts,v,num)=>`<select onchange="set('${p}',this.value,${num?1:0})"><option value="">Select…</option>${opts.map(([a,b])=>`<option value="${a}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const itemOpts=()=>S.items.map((x,i)=>[i,x.name||'Item '+(i+1)]);
const recOpts=()=>S.recipes.map((x,i)=>[i,x.name||'Recipe '+(i+1)]);
const packOpts=()=>S.pack.map((x,i)=>[i,x.name||'Pack '+(i+1)]);
const tbl=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table></div>`;
const mac=m=>MK.map(k=>`<td>${f(m[k],1)}</td>`).join('');
const MH=ML.map(x=>x);
// ---- calculations
const gper={g:1};
function toG(it,q,u){if(!it)return 0;return n(q)*(u==='ml'?(n(it.dens)||1):u==='tsp'?n(it.tsp):u==='tbsp'?n(it.tbsp):u==='cup'?(n(it.cup)||240):1)}
function rcalc(r){const t={w:0,cost:0,cal:0,p:0,c:0,f:0,fi:0};(r.ing||[]).forEach(g=>{const it=S.items[g.i];if(!it)return;const w=toG(it,g.q,g.u),s=stg(it,g);t.w+=w;t.cost+=w*n(it.cost)/1000*s.q;MK.forEach(k=>t[k]+=w*s.m[k]/100)});t.fin=n(r.final)||t.w;return t}
function dish(r,g){const c=rcalc(r),k=c.fin?g/c.fin:0;const o={w:g,cost:c.cost*k};MK.forEach(m=>o[m]=c[m]*k);return o}
function getM(d,t){const k=d+'-'+t;if(!S.menu[k])S.menu[k]={lines:[],pk:[]};return S.menu[k]}
function mealCalc(d,t,ci){const m=getM(d,t),o={w:0,cost:0,pack:0,cal:0,p:0,c:0,f:0,fi:0};m.lines.forEach(l=>{const r=S.recipes[l.r];if(!r)return;const x=dish(r,n(l[CATS[ci][0]]));o.w+=x.w;o.cost+=x.cost;MK.forEach(k=>o[k]+=x[k])});m.pk.forEach(p=>{const pk=S.pack[p.p];if(pk)o.pack+=n(pk.price)*n(p.q)});return o}
function overhead(){const tot=S.exp.reduce((a,b)=>a+n(b.amt),0),meals=n(S.perDay)*24;return{tot,meals,per:meals?tot/meals:0}}
function raw(d,t,ci,qty,acc){getM(d,t).lines.forEach(l=>{const r=S.recipes[l.r];if(!r)return;const c=rcalc(r),k=c.fin?n(l[CATS[ci][0]])*qty/c.fin:0;(r.ing||[]).forEach(g=>{const it=S.items[g.i];if(it)acc[it.name]=(acc[it.name]||0)+toG(it,g.q,g.u)*stg(it,g).q*k})})}
// ---- views
const V={};
V.items=()=>`<div class="card"><h2>Raw items</h2><p class="mu">Enter cost per kg (change it any time) and macros per 100 g. Spoon and ml weights are used in recipes. Newest items are shown first.</p><p><button class="b" onclick="add('items',{name:'',cost:0,cal:0,p:0,c:0,f:0,fi:0,tsp:5,tbsp:15,cup:240,dens:1})">Add raw item</button></p>`+tbl(['Name','Cost / kg','kcal','Protein','Carbs','Fat','Fiber','g per tsp','g per tbsp','g per cup','g per ml',''],S.items.map((x,i)=>`<tr><td><input class="w" list="itl" value="${esc(x.name)}" oninput="dup(this,${i})" onchange="nm(${i},this)"><div id="d${i}" class="mu"></div></td><td>${I(`items.${i}.cost`,x.cost,1)}</td>${MK.map(k=>`<td>${I(`items.${i}.${k}`,x[k],1)}</td>`).join('')}<td>${I(`items.${i}.tsp`,x.tsp,1)}</td><td>${I(`items.${i}.tbsp`,x.tbsp,1)}</td><td>${I(`items.${i}.cup`,x.cup??240,1)}</td><td>${I(`items.${i}.dens`,x.dens,1)}</td><td><button class="x" onclick="del('items',${i})">✕</button></td></tr>`).reverse())+`<datalist id="itl">${S.items.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div>`;
V.recipes=()=>{const r=S.recipes[rsel];let h=`<div class="card"><h2>Recipes</h2><div class="row">${SL('rsel_',recOpts(),rsel,1).replace(/set\('rsel_'.*?\)"/,`rs(this.value)"`)}<button class="b" onclick="S.recipes.push({name:'',people:1,final:0,ing:[]});rsel=S.recipes.length-1;save()">New recipe</button>${r?`<button class="x" onclick="del('recipes',${rsel});rsel=0">Delete</button>`:''}</div>`;

return`<div class="card"><h2>Customers</h2><div class="ig"><aside class="il"><input type="search" placeholder="Search name or phone" oninput="flt(this.value)" style="width:100%"><button class="b" style="width:100%;margin:10px 0" onclick="newCust()">Add customer</button><div class="ls">${list}</div></aside><section style="min-width:0">${ed}</section></div></div>`};

// ---- Orders

window.newOrder=cid=>{const as=C.addresses.filter(a=>+a.customer_id===+cid),cat='WL',mt='L',d=6;ONew={customer_id:cid||0,address_id:as[0]?+as[0].id:0,category:cat,meal_type:mt,plan_days:d,start_date:nextServing(today()),price:planPrice(cat,mt,d),pm:0,notes:''};osel=0;OD=null;tab='orders';omsg='';render()};
window.setO=(k,v)=>{ONew[k]=v;if(k==='customer_id'){const as=C.addresses.filter(a=>+a.customer_id===+v);ONew.address_id=as[0]?+as[0].id:0}if(['category','meal_type','plan_days'].includes(k)&&!ONew.pm)ONew.price=planPrice(ONew.category,ONew.meal_type,ONew.plan_days);render()};
window.createOrder=async()=>{if(!ONew.customer_id){omsg='Choose a customer.';render();return}const r=await capi('order_create',ONew);if(!r.j.ok){omsg=r.j.error||'Could not create the order.';render();return}ONew=null;osel=r.j.id;omsg='Order created.';await crmLoad();await loadOrder(osel);render()};

window.postpone=async ids=>{if(!confirm('Postpone this meal to the end of the plan?'))return;const r=await capi('postpone',{ids});omsg=r.j.ok?'Moved to '+fmtD(r.j.new_date)+'.':(r.j.error||'Could not postpone.');await crmLoad();await loadOrder(osel);render()};
window.markDel=async(id,st)=>{await capi('deliver',{meal_id:id,status:st});await crmLoad();if(tab==='orders'&&osel)await loadOrder(osel);if(tab==='today')await loadSheet();render()};
window.PY={amount:'',paid_on:'',method:'cash',note:''};

const stTxt={scheduled:'Scheduled',delivered:'Delivered',postponed:'Postponed',cancelled:'Cancelled'};
V.orders=()=>{if(!C.loaded){if(!C.err)crmLoad();return loadCard('Orders')}
if(ONew){const as=C.addresses.filter(a=>+a.customer_id===+ONew.customer_id),sorted=[...C.customers].sort((a,b)=>a.name.localeCompare(b.name)),pp=planPrice(ONew.category,ONew.meal_type,ONew.plan_days),opt=(arr,v)=>arr.map(([a,b])=>`<option value="${a}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('');
return`<div class="card"><h2>New order</h2><p class="mu">The price comes from your plan prices and includes VAT. You can change it for this order.</p>${fld('Customer',`<select onchange="setO('customer_id',+this.value)"><option value="0">Choose a customer</option>${opt(sorted.map(c=>[c.id,c.name+(c.phone?' ('+c.phone+')':'')]),ONew.customer_id)}</select>`)}${fld('Delivery address',as.length?`<select onchange="ONew.address_id=+this.value;render()">${opt(as.map(a=>[a.id,(a.label||'Address')+', '+(a.area||a.address)]),ONew.address_id)}</select>`:'<span class="mu">This customer has no address yet. Add one in Customers first, or continue without it.</span>')}<div class="row">${fld('Category',`<select onchange="setO('category',this.value)">${opt(Object.entries(CATN),ONew.category)}</select>`)}${fld('Meals',`<select onchange="setO('meal_type',this.value)">${opt(Object.entries(MTN),ONew.meal_type)}</select>`)}${fld('Length',`<select onchange="setO('plan_days',+this.value)">${opt([[1,'1 day'],[6,'6 days (weekly)'],[24,'24 days (monthly)']],ONew.plan_days)}</select>`)}</div><div class="row">${fld('Start date',`<input type="date" value="${ONew.start_date}" onchange="ONew.start_date=this.value">`)}${fld('Price (VAT included)',`<input type="number" step="any" value="${esc(ONew.price)}" style="width:130px" oninput="ONew.price=this.value;ONew.pm=1">`)}</div>${pp?'':'<p class="neg" style="margin:0 0 10px">No plan price is set for this combination in Expenses and profit. Enter the price here.</p>'}${fld('Order notes',`<input value="${esc(ONew.notes)}" style="width:100%;max-width:520px" oninput="ONew.notes=this.value">`)}<div class="row"><button class="b" onclick="createOrder()">Create order</button><button class="lk" onclick="ONew=null;render()">Cancel</button><span class="neg">${esc(omsg)}</span></div></div>`}
if(osel&&OD){const o=OD.order,paid=OD.payments.reduce((a,p)=>a+n(p.amount),0),bal=n(o.price)-paid,as=C.addresses.filter(a=>+a.customer_id===+o.customer_id),byDate={};OD.meals.forEach(m=>(byDate[m.serve_date]=byDate[m.serve_date]||[]).push(m));
const mrows=Object.keys(byDate).sort().map(d=>{const ms=byDate[d],sch=ms.filter(m=>m.status==='scheduled'),md=menuDay(d);return ms.map((m,i)=>`<tr><td>${i?'':dname(d)}</td><td>${i||!md?'':'Day '+md}</td><td>${m.meal==='L'?'Lunch':'Dinner'}</td><td>${stTxt[m.status]||m.status}${m.moved_from?' <span class="mu">(from '+fmtD(m.moved_from)+')</span>':''}</td><td>${m.status==='scheduled'?`<button class="lk" onclick="markDel(${m.id},'delivered')">Delivered</button> <button class="lk" onclick="postpone([${m.id}])">Postpone</button>${sch.length>1&&i===0?` <button class="lk" onclick="postpone([${sch.map(x=>x.id).join(',')}])">Postpone day</button>`:''}`:m.status==='delivered'?`<button class="lk" onclick="markDel(${m.id},'scheduled')">Undo delivered</button>`:''}</td></tr>`).join('')}).join('');
return`<div class="card"><div class="row"><button class="lk" onclick="osel=0;OD=null;render()">Back to orders</button><span class="neg">${esc(omsg)}</span></div><h2>Order #${o.id}, ${esc(o.customer_name)}</h2><p class="mu">${planTxt(o)}${o.status==='cancelled'?', cancelled':''}. Phone ${esc(o.customer_phone||'-')}</p><div class="sts"><div class="sb"><span>Price (VAT included)</span><b>${f(o.price,2)}</b></div><div class="sb"><span>Paid</span><b>${f(paid,2)}</b></div><div class="sb"><span>Balance</span><b class="${bal>0?'neg':'pos'}">${f(bal,2)}</b></div></div>
<h3>Delivery</h3><div class="row">${fld('Address',`<select onchange="OD.order.address_id=+this.value"><option value="0">No address</option>${as.map(a=>`<option value="${a.id}" ${+a.id===+o.address_id?'selected':''}>${esc((a.label||'Address')+', '+(a.area||a.address))}</option>`).join('')}</select>`)}${fld('Order notes',`<input value="${esc(o.notes||'')}" style="width:300px" oninput="OD.order.notes=this.value">`)}<button class="b" onclick="saveOrderInfo()">Save</button></div>
<h3>Payments</h3>${OD.payments.length?tbl(['Date','Amount','Method','Note','By',''],OD.payments.map(p=>`<tr><td>${fmtD(p.paid_on)}</td><td>${f(p.amount,2)}</td><td>${esc(p.method)}</td><td>${esc(p.note||'')}</td><td>${esc(p.created_by)}</td><td><button class="x" style="font-size:13px" onclick="delPay(${p.id})">Delete payment</button></td></tr>`)):'<p class="mu">No payments yet.</p>'}<div class="row" style="margin-top:8px"><input type="number" step="any" placeholder="Amount" value="${esc(PY.amount)}" style="width:110px" oninput="PY.amount=this.value"><select onchange="PY.method=this.value">${[['cash','Cash'],['card','Card'],['transfer','Bank transfer'],['online','Online link']].map(([a,b])=>`<option value="${a}" ${PY.method===a?'selected':''}>${b}</option>`).join('')}</select><input type="date" value="${PY.paid_on||today()}" onchange="PY.paid_on=this.value"><input placeholder="Note" value="${esc(PY.note)}" style="width:180px" oninput="PY.note=this.value"><button class="b" onclick="addPay()">Add payment</button></div>
<h3>Meals (${OD.meals.filter(m=>['scheduled','delivered'].includes(m.status)).length}, ${OD.meals.filter(m=>m.status==='delivered').length} delivered)</h3>${tbl(['Date','Menu day','Meal','Status',''],[mrows])}${o.status==='active'?'<p><button class="x" style="font-size:13px" onclick="cancelOrder()">Delete (cancel) this order</button></p>':''}</div>`}
const q=oq.toLowerCase(),rows=C.orders.filter(o=>(ofil==='all'||(ofil==='balance'?o.status!=='cancelled'&&n(o.price)-n(o.paid)>0.005:o.status==='active'&&+o.done_meals<+o.total_meals))&&(!q||cname(o.customer_id).toLowerCase().includes(q)||String(o.id)===q)).map(o=>`<tr><td>#${o.id}</td><td>${esc(cname(o.customer_id))}</td><td>${planTxt(o)}${o.status==='cancelled'?' (cancelled)':''}</td><td>${fmtD(o.start_date)}</td><td>${o.end_date?fmtD(o.end_date):''}</td><td>${o.done_meals}/${o.total_meals}</td><td>${f(o.price,2)}</td><td>${f(o.paid,2)}</td><td class="${n(o.price)-n(o.paid)>0.005&&o.status!=='cancelled'?'neg':''}">${f(n(o.price)-n(o.paid),2)}</td><td><button class="lk" onclick="openOrder(${o.id})">Open</button></td></tr>`);
return`<div class="card"><h2>Orders</h2><div class="row"><button class="b" onclick="newOrder(0)">New order</button><select onchange="ofil=this.value;render()">${[['active','Running orders'],['balance','With balance due'],['all','All orders']].map(([a,b])=>`<option value="${a}" ${ofil===a?'selected':''}>${b}</option>`).join('')}</select><input type="search" placeholder="Customer name or order number" value="${esc(oq)}" style="width:240px" onchange="oq=this.value;render()"><span class="mu">${rows.length} order${rows.length===1?'':'s'}. Prices include VAT.</span></div>${rows.length?tbl(['Order','Customer','Plan','Start','Ends','Meals done','Price','Paid','Balance',''],rows):'<p class="mu">No orders here yet.</p>'}</div>`};

// ---- Today (production and delivery)
async function loadSheet(){const d=tdate,r=await capi('sheet',{date:d});TSL=false;TS={date:d,rows:r.j.rows||[]};render()}
window.setCycle=async()=>{const v=document.getElementById('cyc').value;const r=await capi('settings_save',{cycle_start:v});smsg=r.j.ok?'Saved.':(r.j.error||'Could not save.');await crmLoad()};
window.addHol=async()=>{const v=document.getElementById('hol').value;if(!v)return;const r=await capi('holiday_add',{date:v,note:''});smsg=r.j.ok?'Holiday added.':(r.j.error||'Could not add.');await crmLoad()};
window.delHol=async d=>{if(!confirm('Delete this holiday?'))return;await capi('holiday_delete',{date:d});await crmLoad()};
V.today=()=>{if(!C.loaded){if(!C.err)crmLoad();return loadCard('Today')}
if(!tdate)tdate=nextServing(today());const md=menuDay(tdate);if(!TS||TS.date!==tdate){if(!TSL){TSL=true;loadSheet()}}
const ctl=`<div class="card"><h2>Today</h2><div class="row"><button class="lk" onclick="tdate=addDays(tdate,-1);render()">Previous day</button><input type="date" value="${tdate}" onchange="tdate=this.value||tdate;render()"><button class="lk" onclick="tdate=addDays(tdate,1);render()">Next day</button><button class="lk" onclick="tdate=nextServing(today());render()">Today</button><b>${dname(tdate)}</b>${md?`<span class="tag">Menu day ${md}</span>`:`<span class="mu">${C.settings.cycle_start?(isServing(tdate)?'Before the menu cycle starts':'Not a serving day'):'Set the menu cycle start date below'}</span>`}</div></div>`;
const set=`<div class="card"><h2>Menu cycle and holidays</h2><p class="mu">Day 1 of your 24-day menu starts on this date. Serving is Monday to Saturday, and holidays are skipped.</p><div class="row">Day 1 date <input id="cyc" type="date" value="${C.settings.cycle_start||''}"><button class="b" onclick="setCycle()">Save</button><span class="mu">${esc(smsg)}</span></div><div class="row">Holiday <input id="hol" type="date"><button class="b" onclick="addHol()">Add holiday</button></div>${C.holidays.length?'<div class="row">'+C.holidays.map(h=>`<span class="tag">${fmtD(h)}</span><button class="x" style="font-size:12px" onclick="delHol('${h}')">Delete holiday</button>`).join(' ')+'</div>':''}<p class="mu">Holidays you add later don't move meals that are already scheduled.</p></div>`;
if(!TS||TS.date!==tdate)return ctl+loadCard('Meals for the day')+set;
const rows=TS.rows,cnt={};rows.forEach(r=>{const k=r.meal+r.category;cnt[k]=(cnt[k]||0)+1});
const acc={},tot={q:0,w:0,cost:0,cal:0,p:0,c:0,f:0,fi:0},pr=[];
['L','D'].forEach(t=>CATS.forEach((c,ci)=>{const q=cnt[t+c[0]]||0;if(!q)return;tot.q+=q;if(md){const o=mealCalc(md,t,ci);raw(md,t,ci,q,acc);tot.w+=o.w*q;tot.cost+=(o.cost+o.pack)*q;MK.forEach(k=>tot[k]+=o[k]*q);pr.push(`<tr><td>${t==='L'?'Lunch':'Dinner'}</td><td>${c[1]}</td><td><b>${q}</b></td><td>${f(o.w*q)}</td><td>${f((o.cost+o.pack)*q,2)}</td>${mac(Object.fromEntries(MK.map(k=>[k,o[k]*q])))}</tr>`)}else pr.push(`<tr><td>${t==='L'?'Lunch':'Dinner'}</td><td>${c[1]}</td><td><b>${q}</b></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`)}));
const prod=`<div class="card"><h2>Meals to make</h2>${rows.length?tbl(['Meal','Category','Meals','Weight g','Cost',...ML],pr.concat([`<tr style="font-weight:700"><td>Total</td><td></td><td>${tot.q}</td><td>${f(tot.w)}</td><td>${f(tot.cost,2)}</td><td colspan="5"></td></tr>`])):'<p class="mu">No meals are scheduled for this day.</p>'}${rows.length&&!md?'<p class="neg">Set the menu cycle start date below to see weights, cost and raw materials.</p>':''}</div>`;
const rawc=md&&rows.length?`<div class="card"><h2>Raw materials for the day</h2>${tbl(['Item','Grams','Kg'],Object.entries(acc).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${f(v)}</td><td>${f(v/1000,2)}</td></tr>`))}</div>`:'';
const by={};rows.forEach(r=>{const a=r.area||'No area';(by[a]=by[a]||[]).push(r)});
const dl=rows.length?`<div class="card"><h2>Delivery list</h2>${Object.keys(by).sort().map(a=>`<h3>${esc(a)} (${by[a].length})</h3>`+tbl(['Customer','Phone','Address','Meal','Category','Balance',''],by[a].map(r=>`<tr><td>${esc(r.name)}${r.order_notes?`<div class="mu">${esc(r.order_notes)}</div>`:''}</td><td>${esc(r.phone||'')}</td><td>${esc(r.address||'')}${r.map_url?` <a class="lk" href="${esc(r.map_url)}" target="_blank" rel="noopener">Map</a>`:''}${r.address_notes?`<div class="mu">${esc(r.address_notes)}</div>`:''}</td><td>${r.meal==='L'?'Lunch':'Dinner'}</td><td>${r.category}</td><td class="${n(r.price)-n(r.paid)>0.005?'neg':''}">${f(n(r.price)-n(r.paid),2)}</td><td>${r.status==='delivered'?`<button class="lk" onclick="markDel(${r.id},'scheduled')">Delivered. Undo</button>`:`<button class="b" onclick="markDel(${r.id},'delivered')">Delivered</button>`}</td></tr>`))).join('')}</div>`:'';
return ctl+prod+rawc+dl+set};
setInterval(()=>{if(!ready||document.hidden||!CRMTABS.includes(tab))return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;if(CD||ONew||AD)return;crmLoad().then(()=>{if(tab==='today'&&tdate)loadSheet()})},20000);

let VER=0;
async function poll(){if(!ready||saving||dirty||document.hidden)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;const v=await api('ver');if(v.status===401){ready=false;showLogin('Your session ended. Please log in again.');return}if(!v.j.ok||v.j.ver<=VER)return;const r=await api('load');if(!r.j.ok||!r.j.json||dirty||saving)return;try{S=Object.assign(DEF(),JSON.parse(r.j.json))}catch(e){return}VER=r.j.ver;migrate();const y=scrollY;render();scrollTo(0,y);showSt('Updated from another user')}
setInterval(poll,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

async function boot(){const m=await api('me');if(!m.j.ok){showLogin();return}ROLE=m.j.role;WHO=m.j.user;await loadState()}

boot();
