<header><div class="hw"><span class="lg">🥗</span><div><h1>Healthy Meal Manager</h1><div class="sub">Costing, menu and plans for Weight Loss, Weight Balance and Weight Gain meals</div></div></div></header><div id="bar"><nav id="nav"></nav><div id="ctl"><span id="sv"></span><button class="b" id="lob" onclick="logout()">Log out</button></div></div><main id="app"></main>
<script>
const K='hm-phase1';const DEF=()=>({items:[],recipes:[],pack:[],menu:{},exp:{Delivery:0,Gas:0,Electricity:0,Mobile:0,Ads:0,Cook:0,Helper:0},perDay:50,prices:{},q:{L:[0,0,0],D:[0,0,0]}});let S=DEF();

const CATS=[['WL','Weight Loss'],['WB','Weight Balance'],['WG','Weight Gain']],MK=['cal','p','c','f','fi'],ML=['kcal','Protein','Carbs','Fat','Fiber'];

// ---- calculations
const gper={g:1};
function toG(it,q,u){if(!it)return 0;return n(q)*(u==='ml'?(n(it.dens)||1):u==='tsp'?n(it.tsp):u==='tbsp'?n(it.tbsp):u==='cup'?(n(it.cup)||240):1)}
const AUTOCY=[[/pasta|spaghetti|macaroni|penne|fusilli/,220],[/noodle|vermicelli/,200],[/quinoa/,280],[/rice|basmati|dawath|pulao/,260],[/chickpea|chana|rajma|kidney|lobia|beans?\b/,220],[/\bdal\b|daal|lentil|masoor|moong|toor|urad/,240],[/chicken/,70],[/mutton|lamb|goat|beef|veal/,65],[/fish|prawn|shrimp|salmon|tuna|hamour|kingfish/,80],[/\boats?\b/,250]];
const autoCy=name=>{const t=String(name||'').toLowerCase();if(/flour|oil|powder|paste|sauce|vinegar|milk|bran|stock|cube|masala|spice|seasoning|butter|ghee|cream|juice|salt|pepper|water/.test(t))return 100;for(const[r,v]of AUTOCY)if(r.test(t))return v;return 100};
const cyOf=it=>(it.cy!==undefined&&it.cy!==''&&it.cy!==null&&n(it.cy)>0)?n(it.cy):autoCy(it.name);
const parts=r=>(r.parts&&r.parts.length)?r.parts:[{name:'',final:n(r.final),water:0}];
function pcalc(r,pi){const t={w:0,raw:0,est:0,cost:0,cal:0,p:0,c:0,f:0,fi:0};(r.ing||[]).forEach(g=>{if((g.pt||0)!==pi)return;const it=S.items[g.i];if(!it)return;const w=toG(it,g.q,g.u),s=stg(it,g);t.w+=w;t.raw+=w*s.q;t.est+=w*cyOf(it)/100;t.cost+=w*n(it.cost)/1000*s.q;MK.forEach(k=>t[k]+=w*s.m[k]/100)});const pt=parts(r)[pi]||{};t.estf=t.est+n(pt.water);t.fin=n(pt.final)>0?n(pt.final):t.estf;return t}
function rcalc(r){const t={w:0,raw:0,est:0,cost:0,cal:0,p:0,c:0,f:0,fi:0,fin:0};parts(r).forEach((_,i)=>{const c=pcalc(r,i);['w','raw','est','cost','fin',...MK].forEach(k=>t[k]+=c[k])});return t}
function dish(r,g,pt){const c=pcalc(r,pt||0),k=c.fin?g/c.fin:0;const o={w:g,cost:c.cost*k};MK.forEach(m=>o[m]=c[m]*k);return o}
const dishName=(r,l)=>{if(!r)return'';const ps=parts(r),pi=l.pt||0;return(r.name||'')+(ps.length>1?' - '+((ps[pi]&&ps[pi].name)||'Part '+(pi+1)):'')};
const dishOpts=()=>{const o=[];S.recipes.forEach((r,ri)=>{const ps=parts(r);ps.forEach((p,pi)=>o.push([ri+':'+pi,(r.name||'Recipe '+(ri+1))+(ps.length>1?' - '+(p.name||'Part '+(pi+1)):'')]))});return o};
const dishSel=(k,i,l)=>`<select onchange="setDish('${k}.lines.${i}',this.value)"><option value="">Select\u2026</option>${dishOpts().map(([v,lb])=>`<option value="${v}" ${v===((l.r===''||l.r==null)?'':l.r+':'+(l.pt||0))?'selected':''}>${esc(lb)}</option>`).join('')}</select>`;
window.setDish=(path,v)=>{const[o,k]=ref(path+'.r'),[o2,k2]=ref(path+'.pt');if(!v){o[k]='';o2[k2]=0}else{const[a,b]=v.split(':');o[k]=+a;o2[k2]=+b}save()};
function getM(d,t){const k=d+'-'+t;if(!S.menu[k])S.menu[k]={lines:[],pk:[]};return S.menu[k]}
function mealCalc(d,t,ci){const m=getM(d,t),o={w:0,cost:0,pack:0,cal:0,p:0,c:0,f:0,fi:0};m.lines.forEach(l=>{const r=S.recipes[l.r];if(!r)return;const x=dish(r,n(l[CATS[ci][0]]),l.pt||0);o.w+=x.w;o.cost+=x.cost;MK.forEach(k=>o[k]+=x[k])});m.pk.forEach(p=>{const pk=S.pack[p.p];if(pk)o.pack+=n(pk.price)*n(p.q)});return o}
function overhead(){const tot=S.exp.reduce((a,b)=>a+n(b.amt),0),meals=n(S.perDay)*24;return{tot,meals,per:meals?tot/meals:0}}
function raw(d,t,ci,qty,acc){getM(d,t).lines.forEach(l=>{const r=S.recipes[l.r];if(!r)return;const pt=l.pt||0,c=pcalc(r,pt),k=c.fin?n(l[CATS[ci][0]])*qty/c.fin:0;(r.ing||[]).forEach(g=>{if((g.pt||0)!==pt)return;const it=S.items[g.i];if(it)acc[it.name]=(acc[it.name]||0)+toG(it,g.q,g.u)*stg(it,g).q*k})})}
// ---- views
const V={};
V.items=()=>`<div class="card"><h2>Raw items</h2><p class="mu">Enter cost per kg (change it any time) and macros per 100 g. Spoon and ml weights are used in recipes. Newest items are shown first.</p><p><button class="b" onclick="add('items',{name:'',cost:0,cal:0,p:0,c:0,f:0,fi:0,tsp:5,tbsp:15,cup:240,dens:1})">Add raw item</button></p>`+tbl(['Name','Cost / kg','kcal','Protein','Carbs','Fat','Fiber','g per tsp','g per tbsp','g per cup','g per ml',''],S.items.map((x,i)=>`<tr><td><input class="w" list="itl" value="${esc(x.name)}" oninput="dup(this,${i})" onchange="nm(${i},this)"><div id="d${i}" class="mu"></div></td><td>${I(`items.${i}.cost`,x.cost,1)}</td>${MK.map(k=>`<td>${I(`items.${i}.${k}`,x[k],1)}</td>`).join('')}<td>${I(`items.${i}.tsp`,x.tsp,1)}</td><td>${I(`items.${i}.tbsp`,x.tbsp,1)}</td><td>${I(`items.${i}.cup`,x.cup??240,1)}</td><td>${I(`items.${i}.dens`,x.dens,1)}</td><td><button class="x" onclick="del('items',${i})">✕</button></td></tr>`).reverse())+`<datalist id="itl">${S.items.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div>`;
V.recipes=()=>{const r=S.recipes[rsel];let h=`<div class="card"><h2>Recipes</h2><div class="row">${SL('rsel_',recOpts(),rsel,1).replace(/set\('rsel_'.*?\)"/,`rs(this.value)"`)}<button class="b" onclick="S.recipes.push({name:'',people:1,final:0,ing:[]});rsel=S.recipes.length-1;save()">New recipe</button>${r?`<button class="x" onclick="del('recipes',${rsel});rsel=0">Delete</button>`:''}</div>`;
if(!r)return h+`<p class="mu">Add a recipe such as Grill Chicken, Gravy, Boiled Potato or Salad.</p></div>`;
const c=rcalc(r),p=`recipes.${rsel}`;
h+=`<div class="row">Name ${I(p+'.name',r.name,0,'w')} ${parts(r).length===1?`Cooked weight (g) ${I(p+'.parts.0.final',(parts(r)[0]||{}).final||'',1)} <span class="mu">Leave empty to use the weight calculated from the ingredients (${f(pcalc(r,0).estf)} g), or type the weight you measured, for example 1000.</span>`:''}</div>`+tbl(['Ingredient','Qty','Unit','Grams','Raw g','Cooked g','Cost',...(parts(r).length>1?['Part']:[]),''],r.ing.map((g,i)=>{const it=S.items[g.i];return`<tr><td><input class="ingin" list="itl3" value="${esc(it?it.name:'')}" placeholder="Type to search an item" onchange="pickIng('${p}.ing.${i}',this)">${it&&it.st&&it.st.length?`<select onchange="set('${p}.ing.${i}.s',this.value,0)"><option value="">Raw</option>${it.st.map((s,j)=>`<option value="${j}" ${String(g.s)===String(j)?'selected':''}>${esc(s.name||'Stage '+(j+1))}</option>`).join('')}</select>`:''}</td><td>${I(`${p}.ing.${i}.q`,g.q,1)}</td><td><select onchange="set('${p}.ing.${i}.u',this.value)">${['g','ml','tsp','tbsp','cup'].map(u=>`<option ${u===g.u?'selected':''}>${u}</option>`).join('')}</select></td><td>${f(toG(it,g.q,g.u),1)}</td><td>${f(it?toG(it,g.q,g.u)*stg(it,g).q:0,1)}</td><td>${f(it?toG(it,g.q,g.u)*cyOf(it)/100:0,1)}</td><td>${f(it?toG(it,g.q,g.u)*n(it.cost)/1000*stg(it,g).q:0,2)}</td>${parts(r).length>1?`<td><select onchange="set('${p}.ing.${i}.pt',this.value,1)">${parts(r).map((x,pi)=>`<option value="${pi}" ${(g.pt||0)===pi?'selected':''}>${esc(x.name||'Part '+(pi+1))}</option>`).join('')}</select></td>`:''}<td><button class="x" onclick="del('${p}.ing',${i})">✕</button></td></tr>`}))+`<p><button class="b" onclick="add('${p}.ing',{i:'',q:0,u:'g',pt:0})">Add ingredient</button></p>`;
const pp=n(r.people)||1;h+=`<h3>Batch result (final ${f(c.fin)} g)</h3>`+tbl(['','Weight','Cost',...MH],[`<tr><td>Whole batch</td><td>${f(c.fin)}</td><td>${f(c.cost,2)}</td>${mac(c)}</tr>`,`<tr><td>Per person</td><td>${f(c.fin/pp)}</td><td>${f(c.cost/pp,2)}</td>${mac(Object.fromEntries(MK.map(k=>[k,c[k]/pp])))}</tr>`,`<tr><td>Per 100 g served</td><td>100</td><td>${f(c.fin?c.cost/c.fin*100:0,2)}</td>${mac(Object.fromEntries(MK.map(k=>[k,c.fin?c[k]/c.fin*100:0])))}</tr>`])+`</div>`;return h};
window.rs=v=>{rsel=+v;render()};
window.dup=(el,i)=>{const v=el.value.trim().toLowerCase(),d=document.getElementById('d'+i);if(!v){d.textContent='';return}const m=S.items.filter((x,j)=>j!==i&&(x.name||'').toLowerCase().includes(v));const ex=m.some(x=>x.name.toLowerCase()===v);d.className=ex?'neg':'mu';d.textContent=m.length?(ex?'Already added: ':'Similar: ')+m.map(x=>x.name).join(', '):''};
window.nm=(i,el)=>{const v=el.value.trim();if(v&&S.items.some((x,j)=>j!==i&&(x.name||'').trim().toLowerCase()===v.toLowerCase())){el.value=(DR.dr&&DR.dr.name)||'';const d=document.getElementById('d'+i);d.className='neg';d.textContent='“'+v+'” already exists, so it was not saved. Use a different name.';return}set('dr.name',v,0)};
V.pack=()=>`<div class="card"><h2>Packaging materials</h2><p class="mu">Add every packing material with its price. You pick them for each meal in the menu.</p>`+tbl(['Name','Price each',''],S.pack.map((x,i)=>`<tr><td>${I(`pack.${i}.name`,x.name,0,'w')}</td><td>${I(`pack.${i}.price`,x.price,1)}</td><td><button class="x" onclick="del('pack',${i})">✕</button></td></tr>`))+`<p><button class="b" onclick="add('pack',{name:'',price:0})">Add packaging</button></p></div>`;
V.menu=()=>{const m=getM(day,mt),k=`menu.${day}-${mt}`;let h=`<div class="card"><h2>Menu planner</h2><div class="row">Day <select onchange="day=+this.value;render()">${[...Array(24)].map((_,i)=>`<option ${i+1===day?'selected':''}>${i+1}</option>`).join('')}</select><select onchange="mt=this.value;render()"><option value="L" ${mt==='L'?'selected':''}>Lunch</option><option value="D" ${mt==='D'?'selected':''}>Dinner</option></select>${[...Array(24)].map((_,i)=>0).length?'':''}<span class="mu">Day ${day} ${mt==='L'?'lunch':'dinner'}</span></div>`;
h+=`<h3>Dishes and grams</h3>`+tbl(['Dish (from recipes)',...CATS.map(c=>c[1]+' g'),''],m.lines.map((l,i)=>`<tr><td>${dishSel(k,i,l)}</td>${CATS.map(c=>`<td>${I(`${k}.lines.${i}.${c[0]}`,l[c[0]],1)}</td>`).join('')}<td><button class="x" onclick="del('${k}.lines',${i})">✕</button></td></tr>`))+`<p><button class="b" onclick="add('${k}.lines',{r:'',pt:0,WL:0,WB:0,WG:0})">Add dish</button></p>`;
h+=`<h3>Packaging for this meal</h3>`+tbl(['Material (from packaging)','Qty','Cost',''],m.pk.map((x,i)=>`<tr><td>${SL(`${k}.pk.${i}.p`,packOpts(),x.p,1)}</td><td>${I(`${k}.pk.${i}.q`,x.q,1)}</td><td>${f(S.pack[x.p]?n(S.pack[x.p].price)*n(x.q):0,2)}</td><td><button class="x" onclick="del('${k}.pk',${i})">✕</button></td></tr>`))+`<p><button class="b" onclick="add('${k}.pk',{p:'',q:1})">Add packaging</button></p>`;
h+=`<h3>Meal totals</h3>`+tbl(['Category','Weight g','Food cost','Packing',...MH],CATS.map((c,ci)=>{const o=mealCalc(day,mt,ci);return`<tr><td>${c[1]}</td><td>${f(o.w)}</td><td>${f(o.cost,2)}</td><td>${f(o.pack,2)}</td>${mac(o)}</tr>`}))+`</div>`;return h};
V.costs=()=>{const o=overhead();return`<div class="card"><h2>Monthly expenses</h2><p class="mu">Shared equally across every meal served. The month has 24 serving days.</p>`+tbl(['Expense','Per month',''],S.exp.map((x,i)=>`<tr><td>${I(`exp.${i}.name`,x.name,0,'w')}</td><td>${I(`exp.${i}.amt`,x.amt,1)}</td><td><button class="x" onclick="del('exp',${i})">✕</button></td></tr>`))+`<p><button class="b" onclick="add('exp',{name:'',amt:0})">Add expense</button></p><div class="row" style="margin-top:12px">Expected meals per day ${I('perDay',S.perDay,1)}</div><p>Total monthly expenses <b>${f(o.tot)}</b> ÷ ${f(o.meals)} meals = <span class="tag">${f(o.per,2)} per meal</span></p><p class="mu">More meals means a lower share per meal.</p></div>`};
const cat3=(t,ci)=>{let s=0,c=0;for(let d=1;d<=24;d++){const m=getM(d,t);if(m.lines.length){const x=mealCalc(d,t,ci);s+=x.cost+x.pack;c++}}return c?s/c:0};
V.plans=()=>{const o=overhead(),T=[['L','Lunch only'],['D','Dinner only'],['B','Lunch and dinner']],D=[[1,'1 day'],[6,'6 days'],[24,'24 days']];const rows=[];CATS.forEach((c,ci)=>T.forEach(([t,tn])=>D.forEach(([d,dn])=>{const key=`${c[0]}|${t}|${d}`,meals=d*(t==='B'?2:1),food=t==='B'?(cat3('L',ci)+cat3('D',ci))*d:cat3(t,ci)*d,cost=food+o.per*meals,pr=n(S.prices[key]),pf=pr-cost;rows.push(`<tr><td>${c[1]}</td><td>${tn}</td><td>${dn}</td><td>${meals}</td><td>${I('prices.'+key,S.prices[key]??0,1)}</td><td>${f(pr/meals,2)}</td><td>${f(food,2)}</td><td>${f(o.per*meals,2)}</td><td class="${pf>=0?'pos':'neg'}">${f(pf,2)}</td></tr>`)})));return`<div class="card"><h2>Plans and profit</h2><p class="mu">Enter the selling price of each plan. Food cost uses the average of your menu days for that category (packing included). Overhead is ${f(o.per,2)} per meal.</p>`+tbl(['Category','Meal type','Length','Meals','Price','Per meal','Food + packing','Overhead','Profit'],rows)+`</div>`};
V.calc=()=>{const acc={},tot={w:0,cost:0,cal:0,p:0,c:0,f:0,fi:0};let h=`<div class="card"><h2>Order calculator</h2><div class="row">Day <select onchange="day=+this.value;render()">${[...Array(24)].map((_,i)=>`<option ${i+1===day?'selected':''}>${i+1}</option>`).join('')}</select></div>`;const rows=[];['L','D'].forEach(t=>{const q=S.q[t];CATS.forEach((c,ci)=>{const nq=n(q[ci]),o=mealCalc(day,t,ci);raw(day,t,ci,nq,acc);const w=o.w*nq,cs=(o.cost+o.pack)*nq;tot.w+=w;tot.cost+=cs;MK.forEach(k=>tot[k]+=o[k]*nq);rows.push(`<tr><td>${t==='L'?'Lunch':'Dinner'}</td><td>${c[1]}</td><td>${I(`q.${t}.${ci}`,q[ci],1)}</td><td>${f(w)}</td><td>${f(cs,2)}</td>${mac(Object.fromEntries(MK.map(k=>[k,o[k]*nq])))}</tr>`)})});
h+=tbl(['Meal','Category','Quantity','Weight g','Cost',...MH],rows)+`<p><b>Day total:</b> ${f(tot.w)} g, cost ${f(tot.cost,2)}</p><h3>Raw materials to prepare for Day ${day}</h3>`+tbl(['Item','Grams','Kg'],Object.entries(acc).filter(a=>a[1]>0).map(([k,v])=>`<tr><td>${k}</td><td>${f(v)}</td><td>${f(v/1000,2)}</td></tr>`))+`</div>`;return h};
const hx=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
V.backup=()=>`<div class="card"><h2>Backup and restore</h2><p class="mu">Everything you enter saves automatically in this browser. To keep a safe copy, click the box below, select all, copy it, and paste it into a note or file on your device.</p><textarea id="bk" rows="7" style="width:100%" readonly onclick="this.select()">${hx(JSON.stringify(S))}</textarea><h3>Restore from a copy</h3><p class="mu">Paste your saved text here. This replaces everything currently in the app.</p><textarea id="rt" rows="5" style="width:100%"></textarea><p><button class="b" onclick="restore()">Restore data</button> <span id="rm" class="mu"></span></p></div>`;
window.restore=()=>{try{const o=JSON.parse(document.getElementById('rt').value);if(!o||!Array.isArray(o.items)||!Array.isArray(o.recipes))throw 0;if(!confirm('Replace ALL current data with this backup?'))return;S=o;migrate();save();document.getElementById('rm').textContent='Data restored.'}catch(e){document.getElementById('rm').textContent='That text is not a valid backup. Copy the full text from the Backup box and try again.'}};
let ssel=0;
V.stages=()=>{if(!S.items.length)return`<div class="card"><h2>Item stages</h2><p class="mu">Add raw items first.</p></div>`;if(!S.items[ssel])ssel=0;const x=S.items[ssel],p=`items.${ssel}`;x.st=x.st||[];const rows=[{name:'Raw',w:1000,fx:1},...x.st.map((s,i)=>({name:s.name,w:n(s.w),i}))];
return`<div class="card"><h2>Item stages</h2><p class="mu">Enter the weight you get from 1000 g of raw item at each stage, such as peeled, boiled or cooked. The total cost and macros stay the same, so cost and macros per 100 g change with the weight.</p><div class="row"><select onchange="ssel=+this.value;render()">${itemOpts().map(([a,b])=>`<option value="${a}" ${a===ssel?'selected':''}>${esc(b)}</option>`).join('')}</select><button class="b" onclick="add('${p}.st',{name:'',w:0})">Add stage</button></div>`+tbl(['Stage','Weight g','Cost per kg','Cost per 100 g','Raw needed for 100 g',...ML.map(l=>l+' per 100 g'),''],rows.map(r=>{const w=r.w,q=w?1000/w:0;return`<tr><td>${r.fx?'Raw (1000 g)':I(`${p}.st.${r.i}.name`,r.name,0,'w')}</td><td>${r.fx?1000:I(`${p}.st.${r.i}.w`,r.w,1)}</td><td>${f(n(x.cost)*q,2)}</td><td>${f(n(x.cost)*q/10,2)}</td><td>${f(w?100*q:0,0)} g</td>${MK.map(k=>`<td>${f(n(x[k])*q,1)}</td>`).join('')}<td>${r.fx?'':`<button class="x" onclick="del('${p}.st',${r.i})">✕</button>`}</td></tr>`}))+`</div>`};
V.rank=()=>{const o=overhead(),rows=[];let cm=0,cn=0;for(let d=1;d<=24;d++)['L','D'].forEach(t=>{if(!getM(d,t).lines.length)return;CATS.forEach((c,ci)=>{const m=mealCalc(d,t,ci),pr=n(S.prices[`${c[0]}|${t}|24`])/24,fc=m.cost+m.pack;if(pr){cm+=pr-fc;cn++}rows.push({d,t,c:c[1],pr,fc,pf:pr-fc-o.per})})});rows.sort((a,b)=>b.pf-a.pf);const avg=cn?cm/cn:0,be=avg>0?Math.ceil(o.tot/avg):0;

async function doSave(){if(saving){stTimer=setTimeout(doSave,500);return}saving=true;dirty=false;const r=await api('save',{json:JSON.stringify(S),base:VER});saving=false;if(r.status===401){ready=false;showLogin('Your session ended. Please log in again.');return}if(r.status===409){showSt('Someone else changed the data. Latest loaded.',true);alert(r.j.error);await loadState();return}if(r.status===403){showSt(r.j.error||'Not allowed',true);alert(r.j.error||'Not allowed');await loadState();return}if(r.j.ok)VER=r.j.ver;showSt(r.j.ok?'Saved':'Not saved, check your connection',!r.j.ok);if(!r.j.ok)dirty=true;else if(dirty)queueSave()}
addEventListener('pagehide',()=>{if(dirty&&ready)try{fetch(API+'?a=save',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({json:JSON.stringify(S),base:VER}),credentials:'same-origin'})}catch(e){}});
function showLogin(msg){ready=false;document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML=`<div class="card" style="max-width:380px;margin:24px auto"><h2>Admin login</h2><p class="mu">Log in to open your meal manager.</p><p><input id="lu" value="admin" autocomplete="username" style="width:100%"></p><p><input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()"></p><p><button class="b" onclick="doLogin()">Log in</button></p><p id="le" class="neg">${msg||''}</p></div>`;showSt('')}

async function loadState(){const r=await api('load');if(r.status===401){showLogin();return}if(!r.j.ok){document.getElementById('app').innerHTML='<div class="card"><h2>Cannot load data</h2><p class="mu">The server did not answer. Check the database settings in config.php, then reload.</p></div>';return}
let first=false;VER=r.j.ver||0;if(r.j.json){try{S=Object.assign(DEF(),JSON.parse(r.j.json))}catch(e){S=DEF()}}else{first=true;try{const l=JSON.parse(localStorage.getItem(K));if(l&&Array.isArray(l.items))S=Object.assign(DEF(),l)}catch(e){}}
migrate();ready=true;if(ROLE==='admin'&&!TABS.some(t=>t[0]==='users'))TABS.push(['users','Users']);const lb=document.getElementById('lob');if(lb)lb.innerHTML='Log out<span class="nm"> ('+esc(WHO)+')</span>';render();if(first)queueSave();else showSt('Loaded')}

const _pk=V.pack,_cf=V.costs;
const xpCard=()=>`<div class="card pp"><h2>Extra prices</h2><p class="mu">The price for each 10 g of an extra, VAT included. When you add an extra to an order, the app uses it as the default, so the price is grams ÷ 10 × this price. You can change it on an order.</p>${tbl(['Extra','Price per 10 g'],Object.entries(EXS).map(([k,l])=>`<tr><td>${l}</td><td>${I('xp.'+k,(S.xp||{})[k]??0,1)}</td></tr>`))}</div>`;
const packDirty=()=>!!DR.pc&&JSON.stringify(DR.pc.pack)!==DR.po;
const finDirty=()=>!!DR.fc&&JSON.stringify(DR.fc)!==DR.fo;
const sbar=(save,undo,dirty)=>`<div class="sbar"><button class="b" onclick="${save}()">Save changes</button><button class="lk" onclick="${undo}()">Undo changes</button>${dirty?'<span class="dirty"><i class="dot wk"></i>Unsaved changes</span>':'<span class="dirty">No unsaved changes</span>'}<span class="dirty">${esc(itMsg)}</span></div>`;
V.pack=()=>{if(!DR.pc||!packDirty()){DR.pc={pack:S.pack.map((x,i)=>({...x,_o:i}))};DR.po=JSON.stringify(DR.pc.pack)}
const bak=S.pack;S.pack=DR.pc.pack;let h='';try{h=_pk()}finally{S.pack=bak}return h.replace('</p>','</p>'+sbar('savePack','undoPack',packDirty()))};
window.savePack=()=>{if(!DR.pc)return;const d=DR.pc.pack,kept=new Set(d.filter(x=>x._o!==undefined).map(x=>x._o));for(let i=S.pack.length-1;i>=0;i--)if(!kept.has(i))fixRefs('pack',i);S.pack=d.map(({_o,...x})=>x);DR.pc=null;itMsg='Saved.';save()};
window.undoPack=()=>{DR.pc=null;itMsg='';render()};
V.costs=()=>{if(!DR.fc||!finDirty()){const c=x=>JSON.parse(JSON.stringify(x));DR.fc={exp:c(S.exp),perDay:S.perDay,prices:c(S.prices||{}),qf:c(S.qf||{WL:0,WB:0,WG:0,d6:5,d24:10}),xp:c(S.xp||{})};DR.fo=JSON.stringify(DR.fc)}
const bak={};FIN.forEach(k=>{bak[k]=S[k];S[k]=DR.fc[k]});let h='';try{h=_cf()+xpCard()}finally{FIN.forEach(k=>S[k]=bak[k])}return sbar('saveFin','undoFin',finDirty())+h};
window.saveFin=()=>{if(!DR.fc)return;FIN.forEach(k=>S[k]=DR.fc[k]);DR.fc=null;itMsg='Saved.';save()};

window.fillPrices=()=>{const T=DR.fc||S;CATS.forEach(c=>['L','D','B'].forEach(t=>[1,6,24].forEach(d=>{const meals=d*(t==='B'?2:1),ds=d===6?n(T.qf.d6):d===24?n(T.qf.d24):0;T.prices[`${c[0]}|${t}|${d}`]=Math.round(n(T.qf[c[0]])*meals*(1-ds/100))})));if(DR.fc)render();else save()};

const CATN={WL:'Weight Loss',WB:'Weight Balance',WG:'Weight Gain'},MTN={L:'Lunch only',D:'Dinner only',B:'Lunch and dinner'},CRMTABS=['customers','orders','grid','today','month'];
let C={loaded:false,err:false,customers:[],addresses:[],orders:[],settings:{},holidays:[],drivers:[]},PP={to:'',meal:''},CD=null,AD=null,ONew=null,osel=0,OD=null,ofil='active',oq='',tdate='',TS=null,TSL=false,cmsg='',omsg='',smsg='';
async function capi(a,body){try{const r=await fetch('crm.php?a='+a,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}if(r.status===401){ready=false;showLogin('Your session ended. Please log in again.')}return{status:r.status,j}}catch(e){return{status:0,j:{}}}}
async function crmLoad(){const r=await capi('boot');if(!r.j.ok){if(r.status!==401){C.err=true;render()}return}C=Object.assign(C,r.j,{loaded:true,err:false});if(osel&&tab==='orders')await loadOrder(osel);render()}
async function loadOrder(id){const r=await capi('order_get',{id});OD=(r.j.ok&&r.j.order)?r.j:null;if(!OD)osel=0}
function ymd(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
const addDays=(d,k)=>{const t=new Date(d+'T00:00:00');t.setDate(t.getDate()+k);return ymd(t)};
const isServing=d=>new Date(d+'T00:00:00').getDay()!==0&&!C.holidays.includes(d);
const nextServing=d=>{let x=d;while(!isServing(x))x=addDays(x,1);return x};
const menuDay=d=>{const cs=C.settings.cycle_start;if(!cs||d<cs||!isServing(d))return null;let c=0,x=cs;while(x<=d){if(isServing(x))c++;x=addDays(x,1)}return(c-1)%24+1};
const dname=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const planPrice=(c,t,d)=>n((S.prices||{})[`${c}|${t}|${d}`]);
const rbyId=id=>S.recipes.find(r=>r.id===id);
function packCalc(items,q){const o={w:0,cost:0,cal:0,p:0,c:0,f:0,fi:0};(items||[]).forEach(it=>{const r=rbyId(it.rid);if(!r)return;const x=dish(r,n(it.g),it.pt||0);o.w+=x.w;o.cost+=x.cost;MK.forEach(k=>o[k]+=x[k])});const m=q==null?1:q;Object.keys(o).forEach(k=>o[k]*=m);return o}
function packRaw(items,q,acc){(items||[]).forEach(it=>{const r=rbyId(it.rid);if(!r)return;const pt=it.pt||0,c=pcalc(r,pt),k=c.fin?n(it.g)*q/c.fin:0;(r.ing||[]).forEach(g=>{if((g.pt||0)!==pt)return;const ii=S.items[g.i];if(ii)acc[ii.name]=(acc[ii.name]||0)+toG(ii,g.q,g.u)*stg(ii,g).q*k})})}
const partType=(r,pt)=>{const p=parts(r)[pt]||{};if(p.type)return p.type;const t=((r.name||'')+' '+(p.name||'')).toLowerCase();if(/gravy|sauce|masala\b/.test(t))return'gravy';if(/chicken|fish|mutton|lamb|beef|egg|prawn|shrimp|paneer|tofu|protein|kebab|tikka/.test(t))return'protein';if(/curry|\bdal\b|sambar|kurma|korma/.test(t))return'curry';if(/rice|pasta|noodle|roti|chapati|dosa|bread|quinoa|pulao|biryani|oats|carb|idli|paratha/.test(t))return'carb';if(/salad|raita/.test(t))return'salad';if(/vegetable|\bveg\b|sabzi|stir fry|poriyal|thoran|beans|cabbage/.test(t))return'veg';return''};
function extraItems(md,t,ex){const out=[];(ex||[]).forEach(e=>{const l=getM(md,t).lines.find(l=>{const r=S.recipes[l.r];return r&&partType(r,l.pt||0)===e.type});if(l){const r=S.recipes[l.r];out.push({rid:r.id,pt:l.pt||0,g:n(e.grams)})}else out.push({miss:e.type})});return out}
const EXL={protein:'chicken / protein',carb:'rice / bread / carbs',veg:'vegetables',salad:'salad',gravy:'gravy',curry:'curry'},EXS={protein:'Protein (chicken, fish)',carb:'Carbs (rice, bread, chapati, dosa)',veg:'Vegetables',salad:'Salad',gravy:'Gravy',curry:'Curry'};
const TYPES=[['','Automatic'],['protein','Protein (chicken, fish)'],['gravy','Gravy or sauce'],['curry','Curry'],['carb','Carbs (rice, bread, chapati, dosa)'],['veg','Vegetable'],['salad','Salad'],['other','Other']];
const xpOf=t=>n((S.xp||{})[t]);
const extrasOf=o=>{try{return o.extras?JSON.parse(o.extras):[]}catch(e){return[]}};
const extrasTxt=o=>extrasOf(o).map(e=>'+'+f(e.grams)+' g '+(EXL[e.type]||e.type)).join(', ');
const planTxt=o=>o.kind==='bulk'?'Event: '+(o.title||'Bulk order'):`${CATN[o.category]}, ${MTN[o.meal_type]}, ${o.plan_days} day${+o.plan_days>1?'s':''}`;

const resetCard=()=>`<div class="card"><h2>Testing tools</h2><p class="mu">Before launch you can clear all test customers, orders and payments. The next customer is numbered 0001 again. Delivery persons, the menu cycle and your Phase 1 data are kept. This cannot be undone.</p><div class="row"><input id="rst" placeholder="Type RESET to confirm"><button class="x" style="font-size:13px" onclick="resetTest()">Delete all customers and orders</button><span class="mu">${esc(smsg)}</span></div></div>`;

// ---- Calendar grid (customers and their meals by day)
let gmon='',GR=null,GRL=false,gq='',gdue=false;
async function loadGrid(){const m=gmon,[from,to]=monRange(m),r=await capi('grid',{from,to});GRL=false;GR={mon:m,rows:r.j.rows||[]};render()}
V.grid=()=>{if(!C.loaded){if(!C.err)crmLoad();return loadCard('Calendar')}
if(!gmon)gmon=today().slice(0,7);if(!GR||GR.mon!==gmon){if(!GRL){GRL=true;loadGrid()}}
const[from,to]=monRange(gmon),days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);const td=today();
const head=`<div class="row"><button class="lk" onclick="gmon=monAdd(gmon,-1);render()">Previous month</button><input type="month" value="${gmon}" onchange="gmon=this.value||gmon;render()"><button class="lk" onclick="gmon=monAdd(gmon,1);render()">Next month</button><button class="lk" onclick="gmon=today().slice(0,7);render()">This month</button><b>${monName(gmon)}</b><input type="search" placeholder="Name or number" value="${esc(gq)}" style="width:170px" onchange="gq=this.value;render()"><label><input type="checkbox" ${gdue?'checked':''} onchange="gdue=this.checked;render()"> Only with balance due</label></div><div class="row legend"><span class="gs gl">1</span> Scheduled <span class="gd gl">1</span> Delivered <span class="gp gl">x</span> Postponed <span class="gs gm gl">5</span> Moved here <span class="gx gl">c</span> Cancelled <span class="mu">Shaded columns are Sundays and holidays. Click a number to open the order.</span></div>`;
if(!GR||GR.mon!==gmon)return`<div class="card"><h2>Calendar</h2>${head}<p class="mu">Loading\u2026</p></div>`;
const by={};GR.rows.forEach(r=>(by[r.order_id]=by[r.order_id]||[]).push(r));const q=gq.toLowerCase();
const os=Object.keys(by).map(id=>C.orders.find(o=>+o.id===+id)).filter(o=>o&&(!q||cname(o.customer_id).toLowerCase().includes(q))&&(!gdue||(o.status!=='cancelled'&&n(o.price)-n(o.paid)>0.005))).sort((a,b)=>+a.customer_id-+b.customer_id||+a.id-+b.id);
const colOff=days.map(d=>!isServing(d)),tot={L:{},D:{}};
GR.rows.forEach(r=>{if(r.status==='scheduled'||r.status==='delivered')tot[r.meal][r.serve_date]=(tot[r.meal][r.serve_date]||0)+1});
const wk=d=>'SMTWTFS'[new Date(d+'T00:00:00').getDay()];
let body='';
os.forEach(o=>{const have=new Set(by[o.id].map(r=>r.meal)),types=['L','D'].filter(x=>o.meal_type==='B'||o.meal_type===x||have.has(x)),due=n(o.price)-n(o.paid),paidFull=isPaid(o);
types.forEach((t,ti)=>{const rs=by[o.id].filter(r=>r.meal===t).sort((a,b)=>a.serve_date<b.serve_date?-1:1),map={};let k=0;rs.forEach(r=>{map[r.serve_date]={...r,num:(r.status==='scheduled'||r.status==='delivered')?++k:0}});
const lead=ti?'':`<td class="l1 ${paidFull?'gpaid':''}" rowspan="${types.length}" onclick="openOrder(${o.id})">${cno(o.customer_id)}</td><td class="l2" rowspan="${types.length}" onclick="openOrder(${o.id})" title="${esc(cname(o.customer_id))}">${esc((C.customers.find(c=>+c.id===+o.customer_id)||{}).name||'')}</td><td class="gi" rowspan="${types.length}">${o.category} ${o.plan_days}d</td>`;
const tail=ti?'':`<td class="gi ${due>0.005&&o.status!=='cancelled'?'gdue':''}" rowspan="${types.length}">${o.status==='cancelled'?'cancelled':paidFull?'Paid':f(due,0)}</td><td class="gi gn" rowspan="${types.length}" title="${esc(((o.notes||'')+' '+extrasTxt(o)).trim())}">${esc(((o.notes||'')+' '+extrasTxt(o)).trim())}</td>`;
body+=`<tr class="${ti?'':'gfirst'}">${lead}<td class="gi">${t}</td>${days.map((d,i)=>{const m=map[d],off=colOff[i]?' off':'';if(!m)return`<td class="${off}"></td>`;const cl=m.status==='delivered'?'gd':m.status==='scheduled'?'gs':m.status==='postponed'?'gp':'gx',tx=m.status==='postponed'?'x':m.status==='cancelled'?'c':m.num,tt=m.status==='postponed'?'Postponed'+(m.moved_to?' to '+dname(m.moved_to):''):m.moved_from?'Moved from '+dname(m.moved_from):stTxt[m.status]||m.status;return`<td class="gc ${cl}${m.moved_from&&m.status!=='postponed'?' gm':''}" title="${esc(dname(d)+': '+tt)}" onclick="openOrder(${o.id})">${tx}</td>`}).join('')}${tail}</tr>`})});
const tr=t=>`<tr class="gtot"><td class="l1"></td><td class="l2">${t==='L'?'Lunch':'Dinner'} total</td><td></td><td class="gi">${t}</td>${days.map((d,i)=>`<td class="${colOff[i]?'off':''}"><b>${tot[t][d]||''}</b></td>`).join('')}<td></td><td></td></tr>`;
return`<div class="card gcard"><h2>Calendar</h2>${head}${os.length?`<div class="gw"><table class="gt"><thead><tr><th class="l1">No.</th><th class="l2">Customer</th><th>Plan</th><th></th>${days.map((d,i)=>`<th class="${colOff[i]?'off':''} ${d===td?'gtoday':''}">${+d.slice(8)}<br><span>${wk(d)}</span></th>`).join('')}<th>Due</th><th>Notes</th></tr></thead><tbody>${body}${tr('L')}${tr('D')}</tbody></table></div>`:'<p class="mu">No orders with meals in this month.</p>'}</div>`};

let OB=null;
const exTotal=o=>{const meals=o.plan_days*(o.meal_type==='B'?2:1);return(o.ex||[]).reduce((a,e)=>a+n(e.grams)/10*n(e.ppt)*meals,0)};
const calcPrice=o=>planPrice(o.category,o.meal_type,o.plan_days)+exTotal(o);
const autoP=()=>{if(!ONew.pm)ONew.price=calcPrice(ONew)};
window.setEx=(i,k,v)=>{if(k==='type'){ONew.ex[i].type=v;ONew.ex[i].ppt=xpOf(v)}else ONew.ex[i][k]=n(v);autoP();render()};
const extrasUI=()=>`<div class="mc" style="margin:6px 0 10px"><b>Extras on every meal</b> <span class="mu">For example +100 g chicken or +50 g rice added to each meal of the plan. The price for each 10 g comes from Extra prices (Expenses and profit), and you can change it here.</span>${(ONew.ex||[]).map((e,i)=>`<div class="row" style="margin-top:6px"><select onchange="setEx(${i},'type',this.value)">${Object.entries(EXS).map(([k,v])=>`<option value="${k}" ${e.type===k?'selected':''}>${v}</option>`).join('')}</select><span><input type="number" step="any" value="${esc(e.grams)}" style="width:80px" onchange="setEx(${i},'grams',this.value)"> g per meal</span><span><input type="number" step="any" value="${esc(e.ppt)}" style="width:80px" onchange="setEx(${i},'ppt',this.value)"> price per 10 g</span><button class="lk" onclick="ONew.ex.splice(${i},1);autoP();render()">Remove extra</button></div>`).join('')}<div class="row" style="margin-top:6px"><button class="lk" onclick="ONew.ex.push({type:'protein',grams:100,ppt:xpOf('protein')});autoP();render()">Add extra</button>${(ONew.ex||[]).length?`<span class="mu">Plan price ${f(planPrice(ONew.category,ONew.meal_type,ONew.plan_days),2)} + extras ${f(exTotal(ONew),2)} for ${ONew.plan_days*(ONew.meal_type==='B'?2:1)} meals</span>`:''}</div></div>`;
// ---- event (bulk) orders
const dishOptsId=()=>{const o=[];S.recipes.forEach(r=>{const ps=parts(r);ps.forEach((p,pi)=>o.push([r.id+':'+pi,(r.name||'Recipe')+(ps.length>1?' - '+(p.name||'Part '+(pi+1)):'')]))});return o};
const obItems=p=>p.items.filter(x=>x.key).map(x=>{const[a,b]=x.key.split(':');return{rid:a,pt:+b,g:n(x.g)}});
const obTotal=()=>OB.packs.reduce((a,p)=>a+n(p.qty)*n(p.price_each),0);
window.newBulk=cid=>{const as=C.addresses.filter(a=>+a.customer_id===+cid);OB={customer_id:cid||0,address_id:as[0]?+as[0].id:0,title:'',notes:'',price:'',pm:0,driver_id:0,packs:[{date:nextServing(today()),meal:'L',name:'',qty:10,price_each:0,items:[{key:'',g:100}]}]};ONew=null;osel=0;OD=null;tab='orders';omsg='';render()};
window.setB=(k,v)=>{OB[k]=v;if(k==='customer_id'){const as=C.addresses.filter(a=>+a.customer_id===+v);OB.address_id=as[0]?+as[0].id:0}render()};
window.setP=(i,k,v)=>{OB.packs[i][k]=(k==='date'||k==='meal'||k==='name')?v:n(v);render()};
window.setPI=(i,j,k,v)=>{OB.packs[i].items[j][k]=k==='key'?v:n(v);render()};
window.dupPack=i=>{const p=JSON.parse(JSON.stringify(OB.packs[i]));p.date=nextServing(addDays(p.date,1));OB.packs.splice(i+1,0,p);render()};
window.createBulk=async()=>{if(!OB.customer_id){omsg='Choose a customer.';render();return}const packs=OB.packs.map(p=>({date:p.date,meal:p.meal,name:p.name,qty:n(p.qty),price_each:n(p.price_each),items:obItems(p)}));if(packs.some(p=>!p.items.length||!p.date||p.qty<1)){omsg='Every pack needs a date, a quantity and at least one dish.';render();return}const r=await capi('order_create_bulk',{customer_id:OB.customer_id,address_id:OB.address_id,title:OB.title,notes:OB.notes,driver_id:OB.driver_id,price:OB.pm?n(OB.price):obTotal(),packs});if(!r.j.ok){omsg=r.j.error||'Could not create the order.';render();return}OB=null;osel=r.j.id;omsg='Event order created.';await crmLoad();await loadOrder(osel);render()};
const bulkForm=()=>{const as=C.addresses.filter(a=>+a.customer_id===+OB.customer_id),sorted=[...C.customers].sort((a,b)=>a.name.localeCompare(b.name)),opt=(arr,v)=>arr.map(([a,b])=>`<option value="${a}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join(''),tot=obTotal(),portions=OB.packs.reduce((a,p)=>a+n(p.qty),0);
let costAll=0;const packsH=OB.packs.map((p,i)=>{const its=obItems(p),c=packCalc(its,1),pe=n(p.price_each);costAll+=c.cost*n(p.qty);return`<div class="mc" style="margin-bottom:10px"><div class="row"><input type="date" value="${p.date}" onchange="setP(${i},'date',this.value)"><select onchange="setP(${i},'meal',this.value)">${opt([['L','Lunch'],['D','Dinner']],p.meal)}</select><input placeholder="Pack name, for example Chicken lunch box" value="${esc(p.name)}" style="width:260px" onchange="setP(${i},'name',this.value)"><span>Portions <input type="number" value="${p.qty}" style="width:80px" onchange="setP(${i},'qty',this.value)"></span><span>Price each <input type="number" step="any" value="${p.price_each}" style="width:90px" onchange="setP(${i},'price_each',this.value)"></span></div>${p.items.map((it,j)=>`<div class="row"><select onchange="setPI(${i},${j},'key',this.value)"><option value="">Choose a dish</option>${opt(dishOptsId(),it.key)}</select><span><input type="number" step="any" value="${it.g}" style="width:80px" onchange="setPI(${i},${j},'g',this.value)"> g per portion</span><button class="lk" onclick="OB.packs[${i}].items.splice(${j},1);render()">Remove dish</button></div>`).join('')}<div class="row"><button class="lk" onclick="OB.packs[${i}].items.push({key:'',g:100});render()">Add dish</button><button class="lk" onclick="dupPack(${i})">Copy to next day</button>${OB.packs.length>1?`<button class="lk" onclick="OB.packs.splice(${i},1);render()">Remove pack</button>`:''}<span class="mu">Cost per portion ${f(c.cost,2)}, ${f(c.cal)} kcal, ${f(c.w)} g. ${pe?`Profit per portion ${f(pe-c.cost,2)}.`:'Enter the price each to see profit.'}</span></div></div>`}).join('');
return`<div class="card"><h2>New event order</h2><p class="mu">For a company or event that orders many meals at once, on one or more dates. Each pack is a meal box with its dishes and grams per portion. Prices include VAT.</p><div class="row">${fld('Customer',`<select onchange="setB('customer_id',+this.value)"><option value="0">Choose a customer</option>${opt(sorted.map(c=>[c.id,cno(c.id)+' '+c.name+(c.phone?' ('+c.phone+')':'')]),OB.customer_id)}</select>`)}${fld('Delivery address',as.length?`<select onchange="OB.address_id=+this.value;render()">${opt(as.map(a=>[a.id,(a.label||'Address')+', '+(a.area||a.address)]),OB.address_id)}</select>`:'<span class="mu">No address yet. Add one in Customers.</span>')}${fld('Delivery person',`<select onchange="OB.driver_id=+this.value"><option value="0">Not assigned</option>${C.drivers.map(d=>`<option value="${d.id}" ${+d.id===+OB.driver_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`)}</div>${fld('Event name',`<input value="${esc(OB.title)}" style="width:100%;max-width:520px" placeholder="For example Company lunch, 12 November" oninput="OB.title=this.value">`)}<h3>Packs</h3>${packsH}<p><button class="lk" onclick="OB.packs.push({date:nextServing(today()),meal:'L',name:'',qty:10,price_each:0,items:[{key:'',g:100}]});render()">Add another pack</button></p><div class="row">${fld('Order total (VAT included)',`<input type="number" step="any" value="${OB.pm?esc(OB.price):tot}" style="width:140px" oninput="OB.price=this.value;OB.pm=1">`)}<span class="mu">${f(portions)} portions. Sum of packs ${f(tot,2)}. Estimated food cost ${f(costAll,2)}.</span></div>${fld('Order notes',`<input value="${esc(OB.notes)}" style="width:100%;max-width:520px" oninput="OB.notes=this.value">`)}<div class="row"><button class="b" onclick="createBulk()">Create event order</button><button class="lk" onclick="OB=null;render()">Cancel</button><span class="neg">${esc(omsg)}</span></div></div>`};
const packsTable=()=>{const ps=OD.packs||[];return ps.length?'<h3>Packs</h3>'+tbl(['Date','Meal','Pack','Portions','Price each','Dishes per portion','Cost per portion'],ps.map(p=>{let its=[];try{its=JSON.parse(p.items)}catch(e){}const c=packCalc(its,1);return`<tr><td>${dname(p.serve_date)}</td><td>${p.meal==='L'?'Lunch':'Dinner'}</td><td>${esc(p.name||'')}</td><td>${p.qty}</td><td>${f(p.price_each,2)}</td><td>${its.map(it=>{const r=rbyId(it.rid);return esc(r?dishName(r,{pt:it.pt}):'(deleted dish)')+' '+f(it.g)+' g'}).join(', ')}</td><td>${f(c.cost,2)}</td></tr>`})):''};

let OE=null;
const oeObj=o=>({category:OE.category,meal_type:o.meal_type,plan_days:+o.plan_days+n(OE.add),ex:OE.ex});
window.openEdit=()=>{const o=OD.order;OE={category:o.category,price:n(o.price),ex:extrasOf(o).map(e=>({type:e.type,grams:n(e.grams),ppt:n(e.ppt)})),add:0};render()};
window.setOE=(k,v)=>{OE[k]=(k==='category')?v:n(v);render()};
window.setOEx=(i,k,v)=>{if(k==='type'){OE.ex[i].type=v;OE.ex[i].ppt=xpOf(v)}else OE.ex[i][k]=n(v);render()};
const oeCalc=o=>{const d0=+o.plan_days,mt=o.meal_type;let base=planPrice(OE.category,mt,d0);if(!base)base=n(o.price)-exTotal({ex:extrasOf(o),plan_days:d0,meal_type:mt});base=Math.max(0,base);const addCost=d0?base/d0*n(OE.add):0,ex=exTotal(oeObj(o));return{base,addCost,ex,total:Math.round((base+addCost+ex)*100)/100}};
window.calcOE=()=>{OE.price=oeCalc(OD.order).total;render()};
window.saveEdit=async()=>{const o=OD.order;const r=await capi('order_edit',{id:osel,category:OE.category,price:n(OE.price),extras:OE.ex,add_days:n(OE.add),address_id:o.address_id||0,driver_id:o.driver_id||0,notes:o.notes||''});omsg=r.j.ok?'Order updated.':(r.j.error||'Could not update.');if(r.j.ok)OE=null;await crmLoad();await loadOrder(osel);render()};
window.cancelMeal=async id=>{if(!confirm('Cancel this meal? The order price does not change, so please handle any refund yourself.'))return;const r=await capi('meal_cancel',{meal_id:id});omsg=r.j.ok?'Meal cancelled.':(r.j.error||'Could not cancel.');await crmLoad();await loadOrder(osel);render()};
const editPanel=o=>{if(o.status==='cancelled')return'';if(!OE)return`<p><button class="lk" onclick="openEdit()">Edit order</button></p>`;const plan=o.kind==='plan',mealsN=(+o.plan_days+n(OE.add))*(o.meal_type==='B'?2:1),oc=plan?oeCalc(o):null;
return`<div class="mc" style="margin:6px 0 10px"><b>Edit order</b>${plan?`<p class="mu" style="margin:4px 0 6px">The category applies to every meal of this order. Extras apply to every meal. Changing the price is separate, so press Use calculated price if you want it recalculated.</p><div class="row">Category <select onchange="setOE('category',this.value)">${Object.entries(CATN).map(([k,v])=>`<option value="${k}" ${OE.category===k?'selected':''}>${v}</option>`).join('')}</select><span>Add more days <input type="number" min="0" max="60" value="${OE.add}" style="width:70px" onchange="setOE('add',this.value)"></span><span class="mu">Adds ${OE.add>0?n(OE.add)+' serving day'+(n(OE.add)>1?'s':'')+' after the last meal.':'no extra days.'}</span></div>${OE.ex.map((e,i)=>`<div class="row"><select onchange="setOEx(${i},'type',this.value)">${Object.entries(EXS).map(([k,v])=>`<option value="${k}" ${e.type===k?'selected':''}>${v}</option>`).join('')}</select><span><input type="number" step="any" value="${esc(e.grams)}" style="width:80px" onchange="setOEx(${i},'grams',this.value)"> g per meal</span><span><input type="number" step="any" value="${esc(e.ppt)}" style="width:80px" onchange="setOEx(${i},'ppt',this.value)"> price per 10 g</span><button class="lk" onclick="OE.ex.splice(${i},1);render()">Remove extra</button></div>`).join('')}<div class="row"><button class="lk" onclick="OE.ex.push({type:'protein',grams:100,ppt:xpOf('protein')});render()">Add extra</button><span class="mu">Plan price ${f(oc.base,2)}${n(OE.add)>0?' + '+n(OE.add)+' added day'+(n(OE.add)>1?'s':'')+' '+f(oc.addCost,2):''} + extras ${f(oc.ex,2)} = ${f(oc.total,2)} for ${mealsN} meals</span></div>`:'<p class="mu" style="margin:4px 0 6px">For an event order you can change the total price here. Packs cannot be edited yet.</p>'}<div class="row">Price (VAT included) <input type="number" step="any" value="${esc(OE.price)}" style="width:120px" oninput="OE.price=this.value">${plan?'<button class="lk" onclick="calcOE()">Use calculated price</button>':''}</div><div class="row"><button class="b" onclick="saveEdit()">Save changes</button><button class="lk" onclick="OE=null;render()">Cancel</button><span class="mu">Address, delivery person and notes are saved from the Delivery row below.</span></div></div>`};

const stTxt={scheduled:'Scheduled',delivered:'Delivered',postponed:'Postponed',cancelled:'Cancelled'};

const sales=rows.reduce((a,r)=>a+(n(r.total_meals)?n(r.price)/n(r.total_meals)*(+r.qty||1):0),0),ohp=overhead().per,oh=ohp*nm,pf=sales-dayCost-oh;
const sbx=(l,v,cl='')=>`<div class="sb"><span>${l}</span><b class="${cl}">${v}</b></div>`;
const res=`<div class="card"><h2>Result for the day</h2><div class="sts">${sbx('Sales (VAT included)',f(sales,2))}${sbx('Food and packing cost',md||!rows.length?f(dayCost,2):'Set menu start')}${sbx('Overhead ('+f(ohp,2)+' per meal)',f(oh,2))}${sbx(pf>=0?'Profit':'Loss',md||!rows.length?f(Math.abs(pf),2):'-',rows.length&&md?(pf>=0?'pos':'neg'):'')}</div><p class="mu" style="margin:0">Sales is each order's price divided by its meals, for the meals served today. Overhead uses the per-meal figure from Expenses and profit.</p></div>`;
const rawc=md&&rows.length?`<div class="card"><h2>Raw materials for the day</h2>${tbl(['Item','Grams','Kg'],Object.entries(acc).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${f(v)}</td><td>${f(v/1000,2)}</td></tr>`))}</div>`:'';
const dsel=r=>`<select onchange="assignRow(${r.id},this.value)"><option value="0">Not assigned</option>${C.drivers.map(d=>`<option value="${d.id}" ${+d.id===effR(r)?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`;
const stop=(r,i,t,did,cnt)=>`<tr><td>${did?i+1:''}</td><td>${r.customer_id?cno(r.customer_id)+' ':''}${esc(r.name)}${r.order_notes?`<div class="mu">${esc(r.order_notes)}</div>`:''}</td><td>${esc(r.phone||'')}</td><td>${r.label?`<span class="chip mv">${esc(r.label)}</span> `:''}${esc(r.address||'')}${r.map_url?` <a class="lk" href="${esc(r.map_url)}" target="_blank" rel="noopener">Map</a>`:''}${r.address_notes?`<div class="mu">${esc(r.address_notes)}</div>`:''}</td><td>${r.kind==='bulk'?'Event '+esc(r.title||'')+' ×'+r.qty:r.category+(r.extras?'<div class="mu">'+extrasTxt(r)+'</div>':'')}</td><td class="${n(r.price)-n(r.paid)>0.005?'neg':''}">${n(r.price)-n(r.paid)>0.005?f(n(r.price)-n(r.paid),2):'<span class="chip del">Paid</span>'}</td><td>${dsel(r)}</td><td>${did?`<button class="bt grey" onclick="routeMove('${t}',${did},${r.id},-1)" ${i===0?'disabled':''}>Up</button> <button class="bt grey" onclick="routeMove('${t}',${did},${r.id},1)" ${i===cnt-1?'disabled':''}>Down</button>`:''}</td><td>${r.status==='delivered'?`<button class="bt grey" onclick="markDel(${r.id},'scheduled')">Delivered. Undo</button>`:`<button class="bt ok" onclick="markDel(${r.id},'delivered')">Delivered</button>`}</td></tr>`;
const hdr=['Stop','Customer','Phone','Address','Category','Balance','Delivery person','Route order',''];
const dlist=t=>{const rs=rows.filter(r=>r.meal===t);if(!rs.length)return'';const secs=C.drivers.map(d=>{const g=grpOf(t,+d.id);return g.length?`<h3>${esc(d.name)}${d.phone?' <span class="mu">'+esc(d.phone)+'</span>':''} (${g.length} stop${g.length>1?'s':''})</h3>`+tbl(hdr,g.map((r,i)=>stop(r,i,t,+d.id,g.length))):''}).join('');const un=grpOf(t,0);
const unh=un.length?`<h3>Not assigned (${un.length})</h3>${C.drivers.length?`<div class="row">Assign all to <select id="aa${t}"><option value="0">Choose</option>${C.drivers.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button class="bt blue" onclick="assignAll('${t}')">Assign</button></div>`:'<p class="mu" style="margin:0">Add delivery persons at the bottom of this page first.</p>'}`+tbl(hdr,un.map((r,i)=>stop(r,i,t,0,un.length))):'';
return`<div class="card od"><h2>${t==='L'?'Lunch':'Dinner'} delivery list (${rs.length})</h2>${secs}${unh}</div>`};
const drvCard=`<div class="card od"><h2>Delivery persons</h2><p class="mu">Add the people who deliver. In each delivery list, assign every order to a person and set the order of their stops. An order can also have a default delivery person.</p>${C.drivers.length?tbl(['Name','Phone',''],C.drivers.map(d=>`<tr><td><input id="dn${d.id}" value="${esc(d.name)}" onchange="saveDrv(${d.id})"></td><td><input id="dp${d.id}" value="${esc(d.phone||'')}" onchange="saveDrv(${d.id})"></td><td><button class="x" style="font-size:12px" onclick="delDrv(${d.id})">Delete delivery person</button></td></tr>`)):''}<div class="row" style="margin-top:6px"><input id="ndn" placeholder="Name"><input id="ndp" placeholder="Phone"><button class="b" onclick="addDrv()">Add delivery person</button><span class="mu">${esc(smsg)}</span></div></div>`;
return ctl+cm+res+menuC+prod+exC+bkC+rawc+dlist('L')+dlist('D')+drvCard+set};

// ---- Monthly orders
const monRange=m=>{const[y,mo]=m.split('-').map(Number);return[ymd(new Date(y,mo-1,1)),ymd(new Date(y,mo,0))]};
const monAdd=(m,k)=>{const[y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const monName=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
const ordersIn=m=>{const[a,b]=monRange(m);return C.orders.filter(o=>o.status==='active'&&o.start_date>=a&&o.start_date<=b)};
let mon='',MR=null,MRL=false;
async function loadMonth(){const m=mon,[from,to]=monRange(m),r=await capi('month',{from,to});MRL=false;MR={mon:m,rows:r.j.rows||[]};render()}
V.month=()=>{if(!C.loaded){if(!C.err)crmLoad();return loadCard('Monthly orders')}
if(!mon)mon=today().slice(0,7);if(!MR||MR.mon!==mon){if(!MRL){MRL=true;loadMonth()}}
const os=ordersIn(mon),po=ordersIn(monAdd(mon,-1)),amt=os.reduce((a,o)=>a+n(o.price),0),pam=po.reduce((a,o)=>a+n(o.price),0),paid=os.reduce((a,o)=>a+n(o.paid),0);
const head=`<div class="row"><button class="lk" onclick="mon=monAdd(mon,-1);render()">Previous month</button><input type="month" value="${mon}" onchange="mon=this.value||mon;render()"><button class="lk" onclick="mon=monAdd(mon,1);render()">Next month</button><button class="lk" onclick="mon=today().slice(0,7);render()">This month</button><b>${monName(mon)}</b></div>`;
if(!MR||MR.mon!==mon)return`<div class="card"><h2>Monthly orders</h2>${head}<p class="mu">Loading\u2026</p></div>`;
let cost=0,miss=0;const cc={},cm={};CATS.forEach(c=>{cc[c[0]]=0;cm[c[0]]=0});cc.EV=0;cm.EV=0;
MR.rows.forEach(r=>{const q=+r.q,ci=CATS.findIndex(c=>c[0]===r.category),md=menuDay(r.serve_date);cm[r.category]=(cm[r.category]||0)+q;if(md==null||ci<0){miss+=q;return}const o=mealCalc(md,r.meal,ci),v=(o.cost+o.pack)*q;cost+=v;cc[r.category]+=v;if(r.extras){extraItems(md,r.meal,extrasOf(r)).forEach(it=>{if(it.miss)return;const x=packCalc([it],q).cost;cost+=x;cc[r.category]+=x})}});
(MR.packs||[]).forEach(p=>{let its=[];try{its=JSON.parse(p.items)}catch(e){}const x=packCalc(its,+p.qty).cost;cost+=x;cc.EV+=x;cm.EV+=+p.qty});
const ovh=S.exp.reduce((a,x)=>a+n(x.amt),0),tc=cost+ovh,pf=amt-tc,meals=CATS.reduce((a,c)=>a+cm[c[0]],0)+cm.EV;
const sbx=(l,v,cl='',sub='')=>`<div class="sb"><span>${l}</span><b class="${cl}">${v}</b>${sub?`<span>${sub}</span>`:''}</div>`,dl=(a,b,fm)=>{const d=a-b;return`${d>0?'+':''}${fm(d)} vs ${monName(monAdd(mon,-1))}`};
const oe=os.filter(o=>o.kind==='bulk'),ae=oe.reduce((x,o)=>x+n(o.price),0),evRow=oe.length?`<tr><td>Event orders</td><td>${oe.length}</td><td>${cm.EV}</td><td>${f(ae,2)}</td><td>${f(cc.EV,2)}</td><td>${f(ae-cc.EV,2)}</td></tr>`:'';
const cat=tbl(['Category','Orders','Meals','Order amount','Food and packing cost','Margin before overheads'],CATS.map(c=>{const oc=os.filter(o=>o.category===c[0]),a=oc.reduce((x,o)=>x+n(o.price),0);return`<tr><td>${c[1]}</td><td>${oc.length}</td><td>${cm[c[0]]}</td><td>${f(a,2)}</td><td>${f(cc[c[0]],2)}</td><td>${f(a-cc[c[0]],2)}</td></tr>`}).concat([evRow,`<tr style="font-weight:700"><td>Total</td><td>${os.length}</td><td>${meals}</td><td>${f(amt,2)}</td><td>${f(cost,2)}</td><td>${f(amt-cost,2)}</td></tr>`]));
const list=os.length?tbl(['Order','Start','Customer','Plan','Amount','Paid','Balance',''],os.map(o=>`<tr class="${isPaid(o)?'paidrow':''}"><td>#${o.id}</td><td>${fmtD(o.start_date)}</td><td>${esc(cname(o.customer_id))}</td><td>${planTxt(o)}</td><td>${f(o.price,2)}</td><td>${f(o.paid,2)}</td><td class="${n(o.price)-n(o.paid)>0.005?'neg':''}">${f(n(o.price)-n(o.paid),2)}</td><td><button class="lk" onclick="openOrder(${o.id})">Open</button></td></tr>`)):'<p class="mu">No orders start in this month yet.</p>';
return`<div class="card"><h2>Monthly orders and result</h2><p class="mu">Orders that start in this month, and the expected cost of all their meals, plus this month's overheads. Add an order and the numbers update. When the month ends, this is its result. Cancelled orders are not counted.</p>${head}
<div class="sts">${sbx('Confirmed orders',os.length,'',dl(os.length,po.length,v=>f(v)))}${sbx('Order amount (VAT included)',f(amt,2),'',dl(amt,pam,v=>f(v,2)))}${sbx('Meals to serve',f(meals))}${sbx('Paid so far',f(paid,2))}${sbx('Balance to collect',f(amt-paid,2),amt-paid>0.005?'neg':'')}</div>
<h3>Expected result</h3><div class="sts">${sbx('Food and packing cost',f(cost,2))}${sbx('Overheads (monthly expenses)',f(ovh,2))}${sbx('Total cost',f(tc,2))}${sbx(pf>=0?'Profit':'Loss',f(Math.abs(pf),2),os.length?(pf>=0?'pos':'neg'):'',amt?f(pf/amt*100,1)+'% of order amount':'')}${sbx(pf>=0?'Above break-even by':'Still needed to break even',f(Math.abs(pf),2))}</div>${miss?`<p class="neg">${miss} meals fall on days with no menu day (before the menu cycle start date, or the date is not set), so their cost counts as zero. Set it in Today.</p>`:''}
<h3>By category</h3>${cat}<h3>Orders in ${monName(mon)}</h3>${list}</div>`};

setInterval(()=>{if(!ready||document.hidden||!CRMTABS.includes(tab))return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;if(CD||ONew||AD)return;crmLoad().then(()=>{if(tab==='today'&&tdate)loadSheet();if(tab==='month'&&mon)loadMonth();if(tab==='grid'&&gmon)loadGrid()})},20000);

let VER=0;
async function poll(){if(!ready||saving||dirty||document.hidden)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;const v=await api('ver');if(v.status===401){ready=false;showLogin('Your session ended. Please log in again.');return}if(!v.j.ok||v.j.ver<=VER)return;const r=await api('load');if(!r.j.ok||!r.j.json||dirty||saving)return;try{S=Object.assign(DEF(),JSON.parse(r.j.json))}catch(e){return}VER=r.j.ver;migrate();const y=scrollY;render();scrollTo(0,y);showSt('Updated from another user')}
setInterval(poll,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

async function boot(){const m=await api('me');if(!m.j.ok){showLogin();return}ROLE=m.j.role;WHO=m.j.user;await loadState()}

boot();
</script></body></html>
