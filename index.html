:root{--bg:#edf3ee;--sf:#fff;--tx:#17302a;--mu:#5d7770;--ln:#d8e4dc;--ac:#1d6b57;--ac2:#f2b705;--bad:#b6402e;--hd:#13423a;--th:#e5efe8;--zb:#f6faf7}

</style></head><body>
<header><div class="hw"><span class="lg">🥗</span><div><h1>Healthy Meal Manager</h1><div class="sub">Costing, menu and plans for Weight Loss, Weight Balance and Weight Gain meals</div></div><div style="margin-left:auto;display:flex;gap:12px;align-items:center"><span id="sv" class="sub"></span><button class="b" style="background:rgba(255,255,255,.16)" onclick="logout()">Log out</button></div></div></header><nav id="nav"></nav><main id="app"></main>
<script>
const K='hm-phase1';const DEF=()=>({items:[],recipes:[],pack:[],menu:{},exp:{Delivery:0,Gas:0,Electricity:0,Mobile:0,Ads:0,Cook:0,Helper:0},perDay:50,prices:{},q:{L:[0,0,0],D:[0,0,0]}});let S=DEF();
function migrate(){if(!S.target)S.target={WL:450,WB:600,WG:750};if(!Array.isArray(S.exp))S.exp=Object.entries(S.exp||{}).map(([name,amt])=>({name,amt}))}migrate();
let tab='items',day=1,mt='L',rsel=0;
const CATS=[['WL','Weight Loss'],['WB','Weight Balance'],['WG','Weight Gain']],MK=['cal','p','c','f','fi'],ML=['kcal','Protein','Carbs','Fat','Fiber'];
const TABS=[['items','Raw items'],['recipes','Recipes'],['pack','Packaging'],['menu','Menu (24 days)'],['costs','Expenses and profit'],['calc','Order calculator'],['rank','Break-even and ranking'],['backup','Backup']];
const n=v=>parseFloat(v)||0,f=(v,d=0)=>(+v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s??'').replace(/"/g,'&quot;');
function save(){queueSave();render()}
function ref(p){const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]];return[o,a[a.length-1]]}
function set(p,v,num){const[o,k]=ref(p);o[k]=num?n(v):v;save()}
function add(p,obj){const[o,k]=ref(p);o[k].push(obj);save()}
function fixRefs(p,i){const m=v=>typeof v!=='number'?v:v===i?'':v>i?v-1:v;if(p==='items')S.recipes.forEach(r=>r.ing.forEach(g=>g.i=m(g.i)));if(p==='recipes')Object.values(S.menu).forEach(x=>x.lines.forEach(l=>l.r=m(l.r)));if(p==='pack')Object.values(S.menu).forEach(x=>x.pk.forEach(q=>q.p=m(q.p)))}
function del(p,i){const[o,k]=ref(p);fixRefs(p,i);o[k].splice(i,1);save()}
const I=(p,v,num,c='')=>`<input class="${c}" ${num?'type="number" step="any"':''} value="${esc(v)}" onchange="set('${p}',this.value,${num?1:0})">`;
const SL=(p,opts,v,num)=>`<select onchange="set('${p}',this.value,${num?1:0})"><option value="">Select…</option>${opts.map(([a,b])=>`<option value="${a}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const itemOpts=()=>S.items.map((x,i)=>[i,x.name||'Item '+(i+1)]);
const recOpts=()=>S.recipes.map((x,i)=>[i,x.name||'Recipe '+(i+1)]);
const packOpts=()=>S.pack.map((x,i)=>[i,x.name||'Pack '+(i+1)]);
const tbl=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table></div>`;
const mac=m=>MK.map(k=>`<td>${f(m[k],1)}</td>`).join('');
const MH=ML.map(x=>x);
// ---- calculations
const gper={g:1};
function toG(it,q,u){if(!it)return 0;return n(q)*(u==='ml'?(n(it.dens)||1):u==='tsp'?n(it.tsp):u==='tbsp'?n(it.tbsp):u==='cup'?(n(it.cup)||240):1)}
function rcalc(r){const t={w:0,cost:0,cal:0,p:0,c:0,f:0,fi:0};(r.ing||[]).forEach(g=>{const it=S.items[g.i];if(!it)return;const w=toG(it,g.q,g.u),s=stg(it,g);t.w+=w;t.cost+=w*n(it.cost)/1000*s.q;MK.forEach(k=>t[k]+=w*s.m[k]/100)});t.fin=n(r.final)||t.w;return t}
function dish(r,g){const c=rcalc(r),k=c.fin?g/c.fin:0;const o={w:g,cost:c.cost*k};MK.forEach(m=>o[m]=c[m]*k);return o}
function getM(d,t){const k=d+'-'+t;if(!S.menu[k])S.menu[k]={lines:[],pk:[]};return S.menu[k]}
function mealCalc(d,t,ci){const m=getM(d,t),o={w:0,cost:0,pack:0,cal:0,p:0,c:0,f:0,fi:0};m.lines.forEach(l=>{const r=S.recipes[l.r];if(!r)return;const x=dish(r,n(l[CATS[ci][0]]));o.w+=x.w;o.cost+=x.cost;MK.forEach(k=>o[k]+=x[k])});m.pk.forEach(p=>{const pk=S.pack[p.p];if(pk)o.pack+=n(pk.price)*n(p.q)});return o}
function overhead(){const tot=S.exp.reduce((a,b)=>a+n(b.amt),0),meals=n(S.perDay)*24;return{tot,meals,per:meals?tot/meals:0}}
function raw(d,t,ci,qty,acc){getM(d,t).lines.forEach(l=>{const r=S.recipes[l.r];if(!r)return;const c=rcalc(r),k=c.fin?n(l[CATS[ci][0]])*qty/c.fin:0;(r.ing||[]).forEach(g=>{const it=S.items[g.i];if(it)acc[it.name]=(acc[it.name]||0)+toG(it,g.q,g.u)*stg(it,g).q*k})})}
// ---- views
const V={};
V.items=()=>`<div class="card"><h2>Raw items</h2><p class="mu">Enter cost per kg (change it any time) and macros per 100 g. Spoon and ml weights are used in recipes. Newest items are shown first.</p><p><button class="b" onclick="add('items',{name:'',cost:0,cal:0,p:0,c:0,f:0,fi:0,tsp:5,tbsp:15,cup:240,dens:1})">Add raw item</button></p>`+tbl(['Name','Cost / kg','kcal','Protein','Carbs','Fat','Fiber','g per tsp','g per tbsp','g per cup','g per ml',''],S.items.map((x,i)=>`<tr><td><input class="w" list="itl" value="${esc(x.name)}" oninput="dup(this,${i})" onchange="nm(${i},this)"><div id="d${i}" class="mu"></div></td><td>${I(`items.${i}.cost`,x.cost,1)}</td>${MK.map(k=>`<td>${I(`items.${i}.${k}`,x[k],1)}</td>`).join('')}<td>${I(`items.${i}.tsp`,x.tsp,1)}</td><td>${I(`items.${i}.tbsp`,x.tbsp,1)}</td><td>${I(`items.${i}.cup`,x.cup??240,1)}</td><td>${I(`items.${i}.dens`,x.dens,1)}</td><td><button class="x" onclick="del('items',${i})">✕</button></td></tr>`).reverse())+`<datalist id="itl">${S.items.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div>`;
V.recipes=()=>{const r=S.recipes[rsel];let h=`<div class="card"><h2>Recipes</h2><div class="row">${SL('rsel_',recOpts(),rsel,1).replace(/set\('rsel_'.*?\)"/,`rs(this.value)"`)}<button class="b" onclick="S.recipes.push({name:'',people:1,final:0,ing:[]});rsel=S.recipes.length-1;save()">New recipe</button>${r?`<button class="x" onclick="del('recipes',${rsel});rsel=0">Delete</button>`:''}</div>`;
if(!r)return h+`<p class="mu">Add a recipe such as Grill Chicken, Gravy, Boiled Potato or Salad.</p></div>`;
const c=rcalc(r),p=`recipes.${rsel}`;
h+=`<div class="row">Name ${I(p+'.name',r.name,0,'w')} For people ${I(p+'.people',r.people,1)} Final cooked weight (g) ${I(p+'.final',r.final,1)}</div>`+tbl(['Ingredient','Qty','Unit','Grams','Cost',''],r.ing.map((g,i)=>{const it=S.items[g.i];return`<tr><td>${SL(`${p}.ing.${i}.i`,itemOpts(),g.i,1)}${it&&it.st&&it.st.length?`<select style="margin-left:6px" onchange="set('${p}.ing.${i}.s',this.value,0)"><option value="">Raw</option>${it.st.map((s,j)=>`<option value="${j}" ${String(g.s)===String(j)?'selected':''}>${esc(s.name||'Stage '+(j+1))}</option>`).join('')}</select>`:''}</td><td>${I(`${p}.ing.${i}.q`,g.q,1)}</td><td><select onchange="set('${p}.ing.${i}.u',this.value)">${['g','ml','tsp','tbsp','cup'].map(u=>`<option ${u===g.u?'selected':''}>${u}</option>`).join('')}</select></td><td>${f(toG(it,g.q,g.u),1)}</td><td>${f(it?toG(it,g.q,g.u)*n(it.cost)/1000*stg(it,g).q:0,2)}</td><td><button class="x" onclick="del('${p}.ing',${i})">✕</button></td></tr>`}))+`<p><button class="b" onclick="add('${p}.ing',{i:'',q:0,u:'g'})">Add ingredient</button></p>`;
const pp=n(r.people)||1;h+=`<h3>Batch result (final ${f(c.fin)} g)</h3>`+tbl(['','Weight','Cost',...MH],[`<tr><td>Whole batch</td><td>${f(c.fin)}</td><td>${f(c.cost,2)}</td>${mac(c)}</tr>`,`<tr><td>Per person</td><td>${f(c.fin/pp)}</td><td>${f(c.cost/pp,2)}</td>${mac(Object.fromEntries(MK.map(k=>[k,c[k]/pp])))}</tr>`,`<tr><td>Per 100 g served</td><td>100</td><td>${f(c.fin?c.cost/c.fin*100:0,2)}</td>${mac(Object.fromEntries(MK.map(k=>[k,c.fin?c[k]/c.fin*100:0])))}</tr>`])+`</div>`;return h};
window.rs=v=>{rsel=+v;render()};
window.dup=(el,i)=>{const v=el.value.trim().toLowerCase(),d=document.getElementById('d'+i);if(!v){d.textContent='';return}const m=S.items.filter((x,j)=>j!==i&&(x.name||'').toLowerCase().includes(v));const ex=m.some(x=>x.name.toLowerCase()===v);d.className=ex?'neg':'mu';d.textContent=m.length?(ex?'Already added: ':'Similar: ')+m.map(x=>x.name).join(', '):''};
window.nm=(i,el)=>{const v=el.value.trim();if(v&&S.items.some((x,j)=>j!==i&&(x.name||'').trim().toLowerCase()===v.toLowerCase())){el.value=S.items[i].name||'';const d=document.getElementById('d'+i);d.className='neg';d.textContent='“'+v+'” already exists, so it was not saved. Use a different name.';return}set('items.'+i+'.name',v,0)};
V.pack=()=>`<div class="card"><h2>Packaging materials</h2><p class="mu">Add every packing material with its price. You pick them for each meal in the menu.</p>`+tbl(['Name','Price each',''],S.pack.map((x,i)=>`<tr><td>${I(`pack.${i}.name`,x.name,0,'w')}</td><td>${I(`pack.${i}.price`,x.price,1)}</td><td><button class="x" onclick="del('pack',${i})">✕</button></td></tr>`))+`<p><button class="b" onclick="add('pack',{name:'',price:0})">Add packaging</button></p></div>`;
V.menu=()=>{const m=getM(day,mt),k=`menu.${day}-${mt}`;let h=`<div class="card"><h2>Menu planner</h2><div class="row">Day <select onchange="day=+this.value;render()">${[...Array(24)].map((_,i)=>`<option ${i+1===day?'selected':''}>${i+1}</option>`).join('')}</select><select onchange="mt=this.value;render()"><option value="L" ${mt==='L'?'selected':''}>Lunch</option><option value="D" ${mt==='D'?'selected':''}>Dinner</option></select>${[...Array(24)].map((_,i)=>0).length?'':''}<span class="mu">Day ${day} ${mt==='L'?'lunch':'dinner'}</span></div>`;
h+=`<h3>Dishes and grams</h3>`+tbl(['Dish (from recipes)',...CATS.map(c=>c[1]+' g'),''],m.lines.map((l,i)=>`<tr><td>${SL(`${k}.lines.${i}.r`,recOpts(),l.r,1)}</td>${CATS.map(c=>`<td>${I(`${k}.lines.${i}.${c[0]}`,l[c[0]],1)}</td>`).join('')}<td><button class="x" onclick="del('${k}.lines',${i})">✕</button></td></tr>`))+`<p><button class="b" onclick="add('${k}.lines',{r:'',WL:0,WB:0,WG:0})">Add dish</button></p>`;

V.calc=()=>{const acc={},tot={w:0,cost:0,cal:0,p:0,c:0,f:0,fi:0};let h=`<div class="card"><h2>Order calculator</h2><div class="row">Day <select onchange="day=+this.value;render()">${[...Array(24)].map((_,i)=>`<option ${i+1===day?'selected':''}>${i+1}</option>`).join('')}</select></div>`;const rows=[];['L','D'].forEach(t=>{const q=S.q[t];CATS.forEach((c,ci)=>{const nq=n(q[ci]),o=mealCalc(day,t,ci);raw(day,t,ci,nq,acc);const w=o.w*nq,cs=(o.cost+o.pack)*nq;tot.w+=w;tot.cost+=cs;MK.forEach(k=>tot[k]+=o[k]*nq);rows.push(`<tr><td>${t==='L'?'Lunch':'Dinner'}</td><td>${c[1]}</td><td>${I(`q.${t}.${ci}`,q[ci],1)}</td><td>${f(w)}</td><td>${f(cs,2)}</td>${mac(Object.fromEntries(MK.map(k=>[k,o[k]*nq])))}</tr>`)})});

V.rank=()=>{const o=overhead(),rows=[];let cm=0,cn=0;for(let d=1;d<=24;d++)['L','D'].forEach(t=>{if(!getM(d,t).lines.length)return;CATS.forEach((c,ci)=>{const m=mealCalc(d,t,ci),pr=n(S.prices[`${c[0]}|${t}|24`])/24,fc=m.cost+m.pack;if(pr){cm+=pr-fc;cn++}rows.push({d,t,c:c[1],pr,fc,pf:pr-fc-o.per})})});rows.sort((a,b)=>b.pf-a.pf);const avg=cn?cm/cn:0,be=avg>0?Math.ceil(o.tot/avg):0;
